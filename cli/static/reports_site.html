}
function openScreening(id){
  const b=$('sb-'+id),c=$('ch-'+id);
  if(b){b.style.display='block';if(c){c.style.transform='rotate(90deg)';c.style.color='var(--accent)'}}
  const el=$('sc-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
}
function sigRow(label,val,tip){
  return `<div style="display:flex;gap:12px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px">
    <div style="min-width:200px;color:var(--muted)"${tip?` title="${esc(tip)}"`:''}>${esc(label)}</div>
    <div style="flex:1;color:var(--dim)">${val}</div></div>`;
}
// Signed % string with win/loss colouring.
function pct(v,dp){ if(v==null)return '—'; const s=(v>0?'+':'')+Number(v).toFixed(dp==null?1:dp)+'%';
  return `<span style="color:${v>0?'var(--win)':(v<0?'var(--loss)':'var(--dim)')}">${s}</span>`; }
function renderCouncilSignals(t){
  const p=t.pricing, a=t.asymmetry, c=t.crowding, pe=t.peers;
  if(!p && !a && !c && !pe) return '';
  let rows='';
  if(p){
    const mv=p.implied_move_pct!=null?`±${p.implied_move_pct}%`+(p.implied_move_expiry?` <span style="color:var(--muted)">(exp ${esc(p.implied_move_expiry)})</span>`:''):'—';
    rows+=sigRow('Implied earnings move',mv,'ATM straddle ÷ spot for the first expiry after earnings');
    const meta=[p.price!=null?`Spot $${Number(p.price).toFixed(2)}`:null,
      p.forward_pe!=null?`Fwd P/E ${p.forward_pe}`:null,
      p.week52_position_pct!=null?`52w pos ${p.week52_position_pct}%`:null].filter(Boolean).join(' · ');
    if(meta)rows+=sigRow('Valuation',meta);
  }
  if(a && a.n_prints){
    const evStr=a.ev!=null?(`<b>${pct(a.ev)}</b>`+(a.ev_to_implied!=null?` <span style="color:var(--muted)">(EV/move ${(a.ev_to_implied>0?'+':'')+a.ev_to_implied})</span>`:'')):'<span style="color:var(--dim)">n/a — no recent miss</span>';
    rows+=sigRow('EV (long into print)',evStr,'P(beat)·E[move|beat] + (1−P(beat))·E[move|miss]');
    const det=[a.e_move_beat!=null?`E[beat] ${pct(a.e_move_beat)}`:null,
      a.e_move_miss!=null?`E[miss] ${pct(a.e_move_miss)}`:null,
      a.fade_rate!=null?`fade ${Math.round(a.fade_rate*100)}%`:null,
      a.coverage_ratio!=null?`coverage ${a.coverage_ratio}×`:null].filter(Boolean).join(' · ');
    rows+=sigRow(`Payoff history (${a.n_beats}B/${a.n_misses}M · ${a.n_prints} prints)`,det);
  }
  if(c){
    const parts=[c.runup_1m_pct!=null?`1m ${pct(c.runup_1m_pct)}`:null,
      c.runup_1m_vs_sector!=null?`${pct(c.runup_1m_vs_sector)} vs ${esc(c.sector_etf||'sector')}`:null,
      c.dist_52w_high_pct!=null?`${c.dist_52w_high_pct}% below 52w high`:null].filter(Boolean).join(' · ');
    if(parts)rows+=sigRow('Run-up / crowding',parts);
    if(c.flags && c.flags.length)rows+=sigRow('',`<span style="color:var(--warn)">⚠ ${c.flags.map(esc).join(' · ')}</span>`);
  }
  if(pe && pe.has_map){
    if(pe.n_reported){
      const chips=(pe.peers||[]).map(x=>{
        const mv=x.day1_move_pct!=null?(x.day1_move_pct>0?'+':'')+Math.round(x.day1_move_pct)+'%':'';
        const tag=x.beat?'B':(x.beat===false?'M':'?');
        const col=x.beat_and_fell?'var(--loss)':(x.beat?'var(--win)':'var(--dim)');
        return `<span style="color:${col}" title="${esc(x.peer)} · ${x.days_ago}d ago">${esc(x.peer)} ${tag}${mv}${x.beat_and_fell?'!':''}</span>`;
      }).join('  ·  ');
      rows+=sigRow('Peer read-through',chips);
      if(pe.sector_bar_elevated)rows+=sigRow('',`<span style="color:var(--loss)">⚠ Elevated bar — a peer beat and still fell; downgrade conviction</span>`);
    } else {
      rows+=sigRow('Peer read-through','<span style="color:var(--muted)">No peers reported in the lookback window</span>');
    }
  }
  if(!rows)return '';
  return `<div class="brief-header">Council Signals</div><div style="padding:8px 22px 14px">${rows}</div>`;
}
function openTickerDetail(runId,ticker){
  const run=(DATA.screening_runs||[]).find(r=>r.id===runId);
  if(!run)return;
  const t=(run.tickers||[]).find(x=>x.ticker===ticker);
  if(!t)return;
  let body='';

  // Score bars
  if(t.beat_score!=null||t.guidance_score!=null||t.setup_score!=null){
    const fundBar=t.fundamentals_score!=null?scoreWidget('Fundamentals',t.fundamentals_score,5):'';
    const fundMeta=t.fundamentals_score!=null?`<div style="font-size:10.5px;color:var(--muted);margin-top:3px">${[t.bs_quality,t.margin_trend,t.growth_quality].filter(Boolean).join(' · ')}</div>`:'';
    body+=`<div class="score-wrap">
      ${scoreWidget('Beat',t.beat_score,5)}
      ${scoreWidget('Guidance',t.guidance_score,5)}
      ${scoreWidget('Setup',t.setup_score,5)}
      ${fundBar}
      ${scoreWidget('Total',t.total_score,15)}
      <div class="score-signals">
        <span class="badge ${badgeClass(t.signal)}">${esc(t.signal||'—')}</span>
        <span class="badge ${badgeClass(t.confidence)}">${esc(t.confidence||'—')}</span>
        ${fundMeta}
      </div>
    </div>`;
    if(t.one_liner){body+=`<blockquote style="margin:0;padding:11px 22px;border-left:3px solid var(--accent);color:var(--dim);background:var(--accent-bg);font-style:italic;font-size:12.5px;line-height:1.55;border-bottom:1px solid var(--border)">${esc(t.one_liner)}</blockquote>`}
    if(t.fundamentals_summary){body+=`<div style="padding:7px 22px 10px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border)">Fundamentals: ${esc(t.fundamentals_summary)}</div>`}
  }

  // Council allocation decision (from the AI Council allocation report)
  if(t.allocation_amount!=null||t.allocation_rationale){
    const amt=t.allocation_amount!=null?`$${Number(t.allocation_amount).toLocaleString()}`:'$0';
    const pctv=t.allocation_pct!=null?`${t.allocation_pct}% of budget`:'';
    const dir=t.allocation_direction||t.signal||'';
    const conv=t.allocation_conviction||'';
    const deployed=(t.allocation_amount||0)>0;
    body+=`<div class="brief-header">Council Allocation</div>
      <div style="padding:10px 22px 14px">
        <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:${t.allocation_rationale?'8px':'0'}">
          <span class="badge ${badgeClass(dir)}">${esc(dir||'—')}</span>
          ${conv?`<span class="badge ${badgeClass(conv)}">${esc(conv)} conviction</span>`:''}
          <span style="font-weight:700;color:${deployed?'var(--accent)':'var(--muted)'}">${amt}${pctv?` <span style="font-weight:400;color:var(--muted)">· ${pctv}</span>`:''}</span>
        </div>
        ${t.allocation_rationale?`<div style="font-size:12px;color:var(--dim);line-height:1.55">${esc(t.allocation_rationale)}</div>`:''}
      </div>`;
  }

  // Council Signals (#14 pricing/EV/asymmetry/crowding, #9 peers)
  body+=renderCouncilSignals(t);

  // Report bodies are not in the first payload (they were ~20 MB of it) — fetch
  // the one report actually being opened, then cache it on the record.
  const needsFetch=usePath&&t.earnings_brief_md==null&&t.has_brief;
  if(needsFetch){
    body+=`<div id="rpt-slot" style="padding:22px 24px;color:var(--muted);font-size:12.5px">Loading report…</div>`;
    openDetail(ticker+' — Analysis',body);
    fetchReport(runId,ticker).then(r=>{
      const slot=$('rpt-slot');if(!slot)return;
      slot.outerHTML=reportBodyHtml(r)||'<p style="padding:20px 24px;color:var(--dim)">No report body available.</p>';
    }).catch(e=>{
      const slot=$('rpt-slot');if(slot)slot.innerHTML=`Could not load the report: ${esc(e.message)}`;
    });
    return;
  }

  body+=reportBodyHtml(t)||`<div class="brief-header">Pre-Earnings Brief &amp; Scores</div><p style="padding:20px 24px;color:var(--dim)">No earnings brief available.</p>`;
  openDetail(ticker+' — Analysis',body);
}

// Markdown halves of a report, in display order.
function reportBodyHtml(r){
  if(!r)return '';
  let h='';
  if(r.portfolio_decision_md)h+=`<div class="pm-header">Portfolio Manager Decision</div><div class="pm-body">${md(r.portfolio_decision_md)}</div>`;
  if(r.earnings_brief_md)h+=`<div class="brief-header">Pre-Earnings Brief &amp; Scores</div>${md(r.earnings_brief_md)}`;
  return h;
}

// Fetch + cache a ticker's report bodies onto the in-memory record.
const _rptCache=new Map();
async function fetchReport(runId,ticker){
  const key=runId+'/'+ticker;
  if(_rptCache.has(key))return _rptCache.get(key);
  const res=await fetch(`/api/report?run=${encodeURIComponent(runId)}&ticker=${encodeURIComponent(ticker)}`);
  if(!res.ok)throw new Error(res.status===404?'report not found on disk':'server error '+res.status);
  const data=await res.json();
  _rptCache.set(key,data);
  const run=(DATA.screening_runs||[]).find(x=>x.id===runId);
  const rec=run&&(run.tickers||[]).find(x=>x.ticker===ticker);
  if(rec){rec.earnings_brief_md=data.earnings_brief_md;rec.portfolio_decision_md=data.portfolio_decision_md;}
  return data;
}

// ── Trades ─────────────────────────────────────────────────────────────────
// The log runs to thousands of fills; the first payload carries the most recent
// few hundred and older ones are pulled a page at a time.
async function loadMoreTrades(btn){
  if(btn){btn.disabled=true;btn.textContent='Loading…';}
  try{
    const have=(DATA.trades||[]).length;
    const res=await fetch(`/api/trades?limit=300&offset=${have}`);
    if(!res.ok)throw new Error('server error '+res.status);
    const payload=await res.json();
    const older=Array.isArray(payload)?payload:(payload.trades||[]);
    if(!Array.isArray(payload)&&payload.total!=null)DATA.total_trades=payload.total;
    DATA.trades=older.concat(DATA.trades||[]);      // log is oldest-first
    renderTrades();
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='Load more — '+e.message;}
  }
}

function renderTrades(){
  const all=consolidate(DATA.trades);
  let f=[...all];
  if(tradeFilter.out!=='all')f=f.filter(t=>t.outcome===tradeFilter.out);
  if(tradeFilter.dir!=='all')f=f.filter(t=>t.direction===tradeFilter.dir);
  if(tradeFilter.q)f=f.filter(t=>(t.ticker||'').toLowerCase().includes(tradeFilter.q.toLowerCase()));
  const tpnl=f.reduce((s,t)=>s+(t.pnl||0),0);
  const wins=f.filter(t=>t.pnl>0).length;
  const wr=f.length?wins/f.length*100:0;

  const loadedFills=(DATA.trades||[]).length;
  const totalFills=DATA.total_trades!=null?DATA.total_trades:loadedFills;
  let h=`<div class="ph"><h2>Trade History</h2><p>${all.length} consolidated positions from ${loadedFills}${totalFills>loadedFills?` of ${totalFills}`:''} fills</p></div>
  <div class="filters">
    <input class="fi" placeholder="Search ticker…" style="width:150px" oninput="tradeFilter.q=this.value;renderTrades()" value="${esc(tradeFilter.q)}">
    <button class="fb ${tradeFilter.out==='all'?'on':''}" onclick="tradeFilter.out='all';renderTrades()">All</button>
    <button class="fb ${tradeFilter.out==='WIN'?'on':''}" onclick="tradeFilter.out='WIN';renderTrades()">Wins</button>
    <button class="fb ${tradeFilter.out==='LOSS'?'on':''}" onclick="tradeFilter.out='LOSS';renderTrades()">Losses</button>
    <span style="width:1px;height:20px;background:var(--border);display:inline-block;margin:0 2px"></span>
    <button class="fb ${tradeFilter.dir==='all'?'on':''}" onclick="tradeFilter.dir='all';renderTrades()">All Dir</button>
    <button class="fb ${tradeFilter.dir==='BUY'?'on':''}" onclick="tradeFilter.dir='BUY';renderTrades()">BUY</button>
    <button class="fb ${tradeFilter.dir==='SHORT'?'on':''}" onclick="tradeFilter.dir='SHORT';renderTrades()">SHORT</button>
    <span style="margin-left:auto;font-size:11.5px;color:var(--dim)">${f.length} positions · <span class="${cp(tpnl)}">${cur(tpnl)}</span> · ${wr.toFixed(1)}% win rate</span>
  </div>
  <div class="tw"><table class="dt"><thead><tr>
    <th>Ticker</th><th>Dir</th><th>Sector</th><th>Exit Date</th>
    <th class="tr">Shares</th><th class="tr">Entry</th><th class="tr">Exit</th>
    <th class="tr">P&amp;L</th><th class="tr">Return</th><th>Outcome</th>
  </tr></thead><tbody>`;
  if(!f.length){h+=`<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--muted)">No trades match the current filters</td></tr>`}
  else f.forEach(t=>{
    const dc=t.direction==='BUY'?'c-win':'c-loss';
    h+=`<tr>
      <td><strong class="tm">${esc(t.ticker)}</strong>${t._fills>1?`<span style="font-size:10px;color:var(--muted);margin-left:3px">×${t._fills}</span>`:''}</td>
      <td><span class="${dc}" style="font-size:12px;font-weight:600">${esc(t.direction||'—')}</span></td>
      <td style="color:var(--dim);font-size:11.5px">${esc(t.sector||'—')}</td>
      <td style="color:var(--dim)">${esc(t.exit_date||'—')}</td>
      <td class="tr tm" style="color:var(--dim)">${t.shares!=null?t.shares.toFixed(0):'—'}</td>
      <td class="tr tm" style="color:var(--dim)">${t.entry_price!=null?'$'+t.entry_price.toFixed(2):'—'}</td>
      <td class="tr tm" style="color:var(--dim)">${t.exit_price!=null?'$'+t.exit_price.toFixed(2):'—'}</td>
      <td class="tr tm ${cp(t.pnl)}">${cur(t.pnl)}</td>
      <td class="tr tm ${cp(t.pnl_pct)}">${pct(t.pnl_pct)}</td>
      <td><span class="badge ${badgeClass(t.outcome)}">${esc(t.outcome||'—')}</span></td>
    </tr>`;
  });
  h+=`</tbody></table></div>`;
  if(totalFills>loadedFills){
    const more=Math.min(300,totalFills-loadedFills);
    h+=`<div style="text-align:center;padding:16px 0"><button class="btn-run" onclick="loadMoreTrades(this)">Load ${more} older fill${more!==1?'s':''} <span style="opacity:.6;font-weight:400">(${loadedFills} of ${totalFills} loaded)</span></button></div>`;
  }
  $('v-trades').innerHTML=h;
}

// ── Reflections ───────────────────────────────────────────────────────────────
async function loadMoreReflections(btn){
  if(btn){btn.disabled=true;btn.textContent='Loading…';}
  try{
    const have=(DATA.reflections||[]).length;
    const res=await fetch(`/api/reflections?limit=40&offset=${have}`);
    if(!res.ok)throw new Error('server error '+res.status);
    const {reflections,total}=await res.json();
    const seen=new Set((DATA.reflections||[]).map(r=>r.id));
    DATA.reflections=(DATA.reflections||[]).concat((reflections||[]).filter(r=>!seen.has(r.id)));
    if(total!=null)DATA.total_reflections=total;
    renderReflections();
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='Load more — '+e.message;}
  }
}

function renderReflections(){
  const refs=DATA.reflections||[];
  let h=`<div class="ph"><h2>Trade Reflections</h2><p>${refs.length} post-mortem${refs.length!==1?'s':''} · click any card to read the full analysis</p></div>`;

// ── Performance dashboard ─────────────────────────────────────────────────────
let dashCharts={}, dashAvgMode='arith', dashDirMode='count';
let dashSortKey='exit_date', dashSortDir=-1;
let dashAll=[];
const dm=n=>n==null?'—':(n<0?'-$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const dp=n=>n==null?'—':(n>=0?'+':'')+n.toFixed(2)+'%';
const dpR=n=>n==null?'—':(n>=0?'+':'')+(n*100).toFixed(2)+'%';
const dcc=n=>n>0?'c-win':n<0?'c-loss':'';
const dGridColor='rgba(51,65,85,0.5)',dTickColor='#8a8b9c';

function dashCostBasis(t){const ep=t.entry_price,sh=t.shares;if(ep&&sh)return ep*sh;const pp=t.pnl_pct;if(pp&&t.pnl)return Math.abs(t.pnl/pp*100);return null;}

function dashAvgReturn(group){
  if(!group.length)return{val:null,pct:null};
  const sumPnl=group.reduce((s,t)=>s+(t.pnl||0),0);
  if(dashAvgMode==='arith')return{val:sumPnl/group.length,pct:group.reduce((s,t)=>s+(t.pnl_pct||0),0)/group.length};
  let wSumPct=0,wSum=0;
  group.forEach(t=>{const cb=dashCostBasis(t);if(cb){wSumPct+=(t.pnl_pct||0)*cb;wSum+=cb;}});
  return{val:sumPnl/group.length,pct:wSum?wSumPct/wSum:group.reduce((s,t)=>s+(t.pnl_pct||0),0)/group.length};
}

// Both portfolio returns need a *capital base* — the money actually at work —
// not Σ of every position's notional. Those differ by the turnover: $15.7M was
// traded across 1,322 fills while the account redeployed roughly $600-800k some
// 26 times, so dividing by the sum reported +0.99% for what was a ~+18% period.
//
// Entry dates are not in the trade log (IBKR's Flex closing record omits the
// open date), so exposure cannot be integrated over time. What can be proven
// without them: trades exiting on the same day were all open on that day, so the
// largest same-day exit notional is a hard lower bound on peak capital at work.
// Conservative by construction — the true average base is lower, so this
// understates the return rather than flattering it.
function dashCapitalBase(trades){
  const byDay=new Map();
  trades.forEach(t=>{
    const d=t.exit_date,cb=dashCostBasis(t);
    if(d&&cb>0)byDay.set(d,(byDay.get(d)||0)+cb);
  });
  let base=0,peakDay=null;
  byDay.forEach((v,d)=>{if(v>base){base=v;peakDay=d;}});
  return{base:base||null,peakDay};
}

function dashComputeReturns(trades){
  const valid=trades.filter(t=>t.pnl!=null);
  if(!valid.length)return null;
  const sorted=[...valid].sort((a,b)=>(a.exit_date||'').localeCompare(b.exit_date||''));
  const totalPnl=sorted.reduce((s,t)=>s+(t.pnl||0),0);
  const totalCost=sorted.reduce((s,t)=>s+(dashCostBasis(t)||0),0);
  const {base,peakDay}=dashCapitalBase(sorted);

  const dates=sorted.map(t=>t.exit_date).filter(Boolean);
  const days=dates.length>=2?(new Date(dates[dates.length-1])-new Date(dates[0]))/86400000:0;
  const ann=r=>(days>=7&&r!=null&&r>-1)?Math.pow(1+r,365/days)-1:null;

  // TWR chain-links *daily* returns. Multiplying 1,322 per-trade HPRs treated
  // concurrent positions as if each reinvested the previous one's proceeds —
  // which is what turned a ~+18% account into a reported +1,580%.
  let twr=null;
  if(base>0){
    const pnlByDay=new Map();
    sorted.forEach(t=>{if(t.exit_date)pnlByDay.set(t.exit_date,(pnlByDay.get(t.exit_date)||0)+(t.pnl||0));});
    let f=1;
    [...pnlByDay.keys()].sort().forEach(d=>{f*=(1+pnlByDay.get(d)/base);});
    twr=f-1;
  }
  const mwr=base>0?totalPnl/base:null;
  return{twr,twrAnn:ann(twr),mwr,mwrAnn:mwr!==null?ann(mwr):null,
         days:Math.round(days),totalCost,totalPnl,base,peakDay,
         turnover:base>0?totalCost/base:null};
}

function dashGetDisplay(){
  const tk=($('dp-f-ticker')||{}).value?.trim().toUpperCase()||'';
  const dir=($('dp-f-dir')||{}).value||'';
  const out=($('dp-f-outcome')||{}).value||'';
  const sec=($('dp-f-sector')||{}).value||'';
  const fr=($('dp-f-from')||{}).value||'';
  const to=($('dp-f-to')||{}).value||'';
  const raw=dashAll.filter(t=>(!tk||(t.ticker||'').includes(tk))&&(!dir||t.direction===dir)&&(!sec||t.sector===sec)&&(!fr||(t.exit_date||'')>=fr)&&(!to||(t.exit_date||'')<=to));
  let trades=consolidate(raw);
  if(out)trades=trades.filter(t=>t.outcome===out);
  return trades;
}

function dashFillSectorFilter(){
  const sel=$('dp-f-sector');if(!sel)return;
  const sectors=[...new Set(dashAll.map(t=>t.sector).filter(Boolean))].sort();

function dashBind(){

}

function dashRender(){
  const trades=dashGetDisplay();
  dashRenderStats(trades);dashRenderAvgReturns(trades);dashRenderDashReturns(trades);
  dashRenderCharts(trades);dashRenderTable(trades);

function dashRenderStats(trades){
  const wins=trades.filter(t=>t.outcome==='WIN').length;
  const total=trades.reduce((s,t)=>s+(t.pnl||0),0);
  const avg=trades.length?total/trades.length:0;
  const wr=trades.length?wins/trades.length*100:null;
  const sorted=[...trades].sort((a,b)=>(a.pnl||0)-(b.pnl||0));
  const best=sorted[sorted.length-1],worst=sorted[0];
  const totalFills=trades.reduce((s,t)=>s+(t._fills||1),0);
  $('dp-s-total')&&($('dp-s-total').textContent=trades.length);
  $('dp-s-total-sub')&&($('dp-s-total-sub').textContent=totalFills!==trades.length?`${totalFills} fills`:'');
  const wrEl=$('dp-s-wr');if(wrEl){wrEl.textContent=wr!=null?wr.toFixed(1)+'%':'—';wrEl.className='stat-value '+(wr>=50?'c-win':wr!=null?'c-loss':'');}
  const pEl=$('dp-s-pnl');if(pEl){pEl.textContent=dm(+total.toFixed(2));pEl.className='stat-value '+dcc(total);}
  const aEl=$('dp-s-avg');if(aEl){aEl.textContent=trades.length?dm(+avg.toFixed(2)):'—';aEl.className='stat-value '+dcc(avg);}
  $('dp-s-best')&&($('dp-s-best').textContent=best?dm(best.pnl):'—');
  $('dp-s-best-t')&&($('dp-s-best-t').textContent=best?best.ticker:'');
  $('dp-s-worst')&&($('dp-s-worst').textContent=worst?dm(worst.pnl):'—');
  $('dp-s-worst-t')&&($('dp-s-worst-t').textContent=worst?worst.ticker:'');
}

function dashRenderAvgReturns(trades){
  const wins=trades.filter(t=>t.outcome==='WIN'),losses=trades.filter(t=>t.outcome==='LOSS');
  const wr=trades.length?wins.length/trades.length:0,lr=trades.length?losses.length/trades.length:0;
  const wS=dashAvgReturn(wins),lS=dashAvgReturn(losses);
  $('dp-s-avgwin-val')&&($('dp-s-avgwin-val').textContent=wS.val!=null?dm(+wS.val.toFixed(2)):'—');
  $('dp-s-avgwin-pct')&&($('dp-s-avgwin-pct').textContent=wS.pct!=null?dp(wS.pct):'');
  $('dp-s-avgloss-val')&&($('dp-s-avgloss-val').textContent=lS.val!=null?dm(+lS.val.toFixed(2)):'—');
  $('dp-s-avgloss-pct')&&($('dp-s-avgloss-pct').textContent=lS.pct!=null?dp(lS.pct):'');
  const pfEl=$('dp-s-pf');
  if(pfEl&&wS.val!=null&&lS.val!=null&&lS.val!==0){const pf=Math.abs(wS.val)/Math.abs(lS.val);pfEl.textContent=pf.toFixed(2);pfEl.className='stat-value '+(pf>=1?'c-win':'c-loss');}
  else if(pfEl){pfEl.textContent='—';pfEl.className='stat-value';}
  const expEl=$('dp-s-exp');
  if(expEl&&wS.val!=null&&lS.val!=null){const e=wr*wS.val+lr*lS.val;expEl.textContent=dm(+e.toFixed(2));expEl.className='stat-value '+dcc(e);}
  else if(expEl){expEl.textContent='—';expEl.className='stat-value';}
  const rEl=$('dp-s-ratio-pct');
  if(rEl&&wS.pct!=null&&lS.pct!=null&&lS.pct!==0){const r=Math.abs(wS.pct)/Math.abs(lS.pct);rEl.textContent=r.toFixed(2)+'x';rEl.className='stat-value '+(r>=1?'c-win':'c-loss');}
  else if(rEl){rEl.textContent='—';rEl.className='stat-value';}
  $('dp-s-ratio-mode')&&($('dp-s-ratio-mode').textContent=dashAvgMode==='arith'?'arithmetic avg':'weighted avg');
}

function dashRenderDashReturns(trades){
  const r=dashComputeReturns(trades);
  if(!r){['dp-s-twr','dp-s-twr-ann','dp-s-mwr','dp-s-mwr-ann'].forEach(id=>{const el=$(id);if(el){el.textContent='—';el.className='stat-value';}});$('dp-s-returns-meta')&&($('dp-s-returns-meta').textContent='');return;}
  const sv=(id,val)=>{const el=$(id);if(!el)return;el.textContent=val!=null?dpR(val):'—';el.className='stat-value '+(val!=null?dcc(val):'');};
  sv('dp-s-twr',r.twr);sv('dp-s-twr-ann',r.twrAnn);sv('dp-s-mwr',r.mwr);sv('dp-s-mwr-ann',r.mwrAnn);
  // Show the base the returns are actually divided by, and the turnover that
  // separates it from Σ notional — the two numbers whose confusion caused the bug.
  const meta=$('dp-s-returns-meta');
  if(meta){
    meta.textContent=r.days>0
      ? `${r.days}-day period · capital base ${dm(Math.round(r.base))}`
        +(r.peakDay?` (peak open ${r.peakDay})`:'')
        +(r.turnover?` · ${r.turnover.toFixed(1)}× turnover, ${dm(Math.round(r.totalCost))} traded`:'')
      : 'single-day period · no annualization';
    meta.title='Capital base = the largest notional exiting on any one day, a provable '
      +'lower bound on capital open at once. Entry dates are not in the trade log, so true '
      +'average exposure cannot be measured; this errs low, understating the return.';
  }
}

function dashRenderCharts(trades){dashBuildCum(trades);dashBuildMonthly(trades);dashBuildTicker(trades);dashBuildDir(trades);}

const dpBaseOpts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}};

function dashBuildCum(trades){
  const can=$('dp-c-cum');if(!can||typeof Chart==='undefined')return;
  const pts=[...trades].sort((a,b)=>(a.exit_date||'').localeCompare(b.exit_date||''));
  let cum=0;const labels=[],data=[];
  pts.forEach(t=>{cum+=t.pnl||0;labels.push(t.exit_date||'');data.push(+cum.toFixed(2));});
  const green=(data[data.length-1]??0)>=0;
  if(dashCharts.cum)dashCharts.cum.destroy();
  dashCharts.cum=new Chart(can,{type:'line',data:{labels,datasets:[{data,fill:true,borderColor:green?'#4ade80':'#f87171',backgroundColor:green?'rgba(74,222,128,0.08)':'rgba(248,113,113,0.08)',borderWidth:2,pointRadius:data.length>60?0:3,pointHoverRadius:4,tension:0.3}]},options:{...dpBaseOpts,scales:{x:{display:false},y:{grid:{color:dGridColor},ticks:{color:dTickColor,callback:v=>'$'+v.toLocaleString()}}}}});
}

function dashBuildMonthly(trades){
  const can=$('dp-c-monthly');if(!can||typeof Chart==='undefined')return;
  const m={};trades.forEach(t=>{const k=(t.exit_date||'').slice(0,7);if(k)m[k]=(m[k]||0)+(t.pnl||0);});
  const labels=Object.keys(m).sort(),data=labels.map(l=>+m[l].toFixed(2));
  if(dashCharts.monthly)dashCharts.monthly.destroy();
  dashCharts.monthly=new Chart(can,{type:'bar',data:{labels,datasets:[{data,backgroundColor:data.map(v=>v>=0?'rgba(74,222,128,0.65)':'rgba(248,113,113,0.65)'),borderRadius:4}]},options:{...dpBaseOpts,scales:{x:{ticks:{color:dTickColor,maxRotation:45},grid:{display:false}},y:{grid:{color:dGridColor},ticks:{color:dTickColor,callback:v=>'$'+v.toLocaleString()}}}}});
}

function dashBuildTicker(trades){
  const can=$('dp-c-ticker');if(!can||typeof Chart==='undefined')return;
  const m={};trades.forEach(t=>{m[t.ticker]=(m[t.ticker]||0)+(t.pnl||0);});
  const sorted=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,14);
  const labels=sorted.map(e=>e[0]),data=sorted.map(e=>+e[1].toFixed(2));
  if(dashCharts.ticker)dashCharts.ticker.destroy();
  dashCharts.ticker=new Chart(can,{type:'bar',data:{labels,datasets:[{data,backgroundColor:data.map(v=>v>=0?'rgba(74,222,128,0.65)':'rgba(248,113,113,0.65)'),borderRadius:3}]},options:{...dpBaseOpts,indexAxis:'y',scales:{x:{grid:{color:dGridColor},ticks:{color:dTickColor,callback:v=>'$'+v.toLocaleString()}},y:{ticks:{color:dTickColor},grid:{display:false}}}}});
}

function dashBuildDir(trades){
  const can=$('dp-c-dir');if(!can||typeof Chart==='undefined')return;
  const dirs=['BUY','SHORT'];
  if(dashCharts.dir)dashCharts.dir.destroy();
  let datasets,yCallback,stacked;
  if(dashDirMode==='count'){
    stacked=true;yCallback=v=>v;
    datasets=[{label:'WIN',backgroundColor:'rgba(74,222,128,0.7)',data:dirs.map(d=>trades.filter(t=>t.direction===d&&t.outcome==='WIN').length)},{label:'LOSS',backgroundColor:'rgba(248,113,113,0.7)',data:dirs.map(d=>trades.filter(t=>t.direction===d&&t.outcome==='LOSS').length)},{label:'BREAK EVEN',backgroundColor:'rgba(148,163,184,0.35)',data:dirs.map(d=>trades.filter(t=>t.direction===d&&t.outcome==='BREAK_EVEN').length)}];
  }else{
    stacked=false;yCallback=v=>'$'+v.toLocaleString();
    const sumPnl=(d,oc)=>+trades.filter(t=>t.direction===d&&t.outcome===oc).reduce((s,t)=>s+(t.pnl||0),0).toFixed(2);
    datasets=[{label:'WIN P&L',backgroundColor:'rgba(74,222,128,0.7)',data:dirs.map(d=>sumPnl(d,'WIN')),borderRadius:4},{label:'LOSS P&L',backgroundColor:'rgba(248,113,113,0.7)',data:dirs.map(d=>sumPnl(d,'LOSS')),borderRadius:4}];
  }
  dashCharts.dir=new Chart(can,{type:'bar',data:{labels:dirs,datasets},options:{...dpBaseOpts,plugins:{legend:{display:true,labels:{color:dTickColor,boxWidth:12,font:{size:11}}}},scales:{x:{stacked,ticks:{color:dTickColor},grid:{display:false}},y:{stacked,grid:{color:dGridColor},ticks:{color:dTickColor,callback:yCallback}}}}});
}

const DASH_COLS=[
  {key:'ticker',label:'Ticker'},{key:'direction',label:'Dir'},{key:'shares',label:'Shares'},

function dashRenderTable(trades){
  const rows=[...trades].sort((a,b)=>{
    let av=a[dashSortKey],bv=b[dashSortKey];
    if(av==null)return dashSortDir;if(bv==null)return -dashSortDir;
    return typeof av==='string'?av.localeCompare(bv)*dashSortDir:(av-bv)*dashSortDir;
  });
  const totalFills=rows.reduce((s,t)=>s+(t._fills||1),0);
  $('dp-t-count')&&($('dp-t-count').textContent=totalFills!==rows.length?`${rows.length} trade${rows.length!==1?'s':''} · ${totalFills} fills`:`${rows.length} trade${rows.length!==1?'s':''}`);
  if(!rows.length){$('dp-t-body')&&($('dp-t-body').innerHTML='<div style="padding:32px;text-align:center;color:var(--muted)">No trades match the current filters.</div>');return;}
  let h='<table class="dt"><thead><tr>';
  DASH_COLS.forEach(c=>{
    const cls=dashSortKey===c.key?(dashSortDir>0?'asc':'desc'):'';
    h+=`<th class="${cls}" style="cursor:pointer;user-select:none" onclick="dashSetSort('${c.key}')">${c.label}</th>`;
  });
  h+='</tr></thead><tbody>';
  rows.forEach(t=>{
    const pnl=t.pnl||0;
    const dirCls=t.direction==='BUY'?'b-buy':'b-short';
    const outCls=t.outcome==='WIN'?'b-win':t.outcome==='LOSS'?'b-loss':'b-neutral';
    const fillsCell=(t._fills||1)>1?`<td style="text-align:center;color:var(--dim);font-size:11px">×${t._fills}</td>`:`<td style="text-align:center;color:var(--muted);font-size:11px">—</td>`;
    h+=`<tr>
      <td><strong class="tm">${esc(t.ticker||'—')}</strong></td>
      <td><span class="badge ${dirCls}">${esc(t.direction||'—')}</span></td>
      <td class="num">${t.shares!=null?(+t.shares).toLocaleString():'—'}</td>
      <td class="num">${t.entry_price!=null?'$'+(+t.entry_price).toFixed(2):'—'}</td>
      <td class="num">${t.exit_price!=null?'$'+(+t.exit_price).toFixed(2):'—'}</td>
      <td class="num ${dcc(pnl)}">${dm(pnl)}</td>
      <td class="num ${dcc(pnl)}">${dp(t.pnl_pct)}</td>
      <td><span class="badge ${outCls}">${esc(t.outcome||'—')}</span></td>
      <td style="color:var(--dim)">${esc(t.exit_date||'—')}</td>
      <td style="color:var(--dim);font-size:11.5px">${esc(t.sector||'—')}</td>
      ${fillsCell}
    </tr>`;
  });
  h+='</tbody></table>';
  $('dp-t-body')&&($('dp-t-body').innerHTML=h);
}

// ── Resume (interrupted runs) ─────────────────────────────────────────────────
async function loadResumeCandidates(){
  const el=$('rsm-list');if(!el)return;
  try{
    const res=await fetch('/api/resume/candidates');
    if(!res.ok)throw new Error('endpoint unavailable — restart the dashboard server to pick it up');
    const runs=await res.json();
    if(!runs.length){el.innerHTML='<span class="c-dim">Nothing to resume — every recent run is complete.</span>';return;}
    el.innerHTML=`<div class="tw"><div style="overflow-x:auto"><table class="dt">
<thead><tr><th>Run</th><th>Screened</th><th>Missing</th><th>Allocation</th><th>Universe</th><th></th></tr></thead>
<tbody>${runs.map(r=>{
  const miss=r.missing?`<span style="color:var(--warn);font-weight:700">${r.missing}</span>`:'<span class="c-dim">0</span>';
  const alloc=r.has_allocation?'<span class="c-dim">present</span>':'<span style="color:var(--warn)">missing</span>';
  const src=r.universe_source==='calendar'?'calendar':'<span title="No calendar entry for this run — only started-but-empty folders can be detected">folder only</span>';
  return `<tr>
    <td style="font-family:var(--mono);font-size:11.5px">${esc(r.name)}</td>
    <td class="num">${r.done}/${r.total}</td>
    <td class="num">${miss}</td>
    <td style="font-size:11.5px">${alloc}</td>
    <td style="font-size:11px;color:var(--dim)">${src}</td>
    <td><button class="wl-btn buy" onclick="runResume('${esc(r.name)}',this)">▶ Resume</button></td>
  </tr>`;}).join('')}</tbody></table></div></div>`;
  }catch(e){
    el.innerHTML=`<span class="c-dim">Could not load resumable runs: ${esc(e.message)}</span>`;
  }
}

// Callable from the Run view's Resume card *and* from any screening run card,
// so the log targets may not exist — fall back to the banner alone.
async function runResume(runName,btn){
  const label=btn?btn.textContent:'▶ Resume';
  const workers=+(($('rsm-workers')||{}).value)||16;
  const budget=+(($('rsm-budget')||{}).value)||100000;
  if(btn){btn.disabled=true;btn.textContent='checking…';}
  try{
    // Preflight: say exactly what will run before committing hours of work.
    const pr=await fetch(`/api/resume/plan?run=${encodeURIComponent(runName)}`);
    if(!pr.ok){
      // A 404 means either "no such run" or "no such route" — and the second is
      // the likely one, because the server only learns this route on restart.
      // FastAPI's unknown-route body is a bare {"detail":"Not Found"}; ours names
      // the run. Reporting "run not found" for a stale server sent one debugging
      // session chasing a folder that was sitting right there.
      let detail='';
      try{detail=((await pr.json())||{}).detail||'';}catch(e){}
      throw new Error(
        pr.status===404&&/^run not found/i.test(detail) ? detail :
        pr.status===404 ? 'this dashboard server predates the resume feature — restart it to pick up /api/resume'
                        : `server error ${pr.status}${detail?': '+detail:''}`);
    }
    const p=await pr.json();
    const mins=Math.round(p.missing.length*20/Math.max(1,workers));
    const extra=(p.calendar_extra||[]).length;
    const extraNote=extra?`\n\n(${extra} other ticker(s) reported that day but were not part of this run — they will NOT be screened.)`:'';
    const msg=p.missing.length
      ? `Resume ${p.name}?\n\n${p.done}/${p.total} screened · ${p.missing.length} missing\nFirst: ${p.missing.slice(0,8).join(', ')}${p.missing.length>8?'…':''}\n\n${workers} workers ≈ ${mins} min, then allocation at $${budget.toLocaleString()}.${extraNote}`
      : `${p.name} has every ticker screened.\n\nRe-run the table${p.has_allocation?' and allocation (overwrites the existing one)':' and run the missing allocation'}?${extraNote}`;
    if(!confirm(msg)){if(btn){btn.disabled=false;btn.textContent=label;}return;}

    const logEl=$('rsm-log'), statusEl=$('rsm-status');
    if(logEl){logEl.textContent='';logEl.classList.add('active');}
    if(statusEl){statusEl.style.display='inline-flex';statusEl.className='job-status running';statusEl.textContent='⟳ running';}
    if(btn)btn.textContent='starting…';

    const res=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:'resume',params:{run_name:runName,budget,workers}})});
    if(!res.ok)throw new Error(await res.text()||res.status);
    const {job_id}=await res.json();
    _bnrShow('resume',job_id);
    if(btn)btn.textContent='running…';
    if(logEl&&statusEl){
      _streamJob(job_id,logEl,statusEl,()=>{if(btn){btn.disabled=false;btn.textContent=label;}loadResumeCandidates();});
    }else{
      // Started from a run card — the banner tracks it from here.
      _streamJob(job_id,{textContent:'',classList:{add(){}}},{className:'',textContent:'',style:{}},
                 ()=>{if(btn){btn.disabled=false;btn.textContent=label;}});
    }
  }catch(e){
    alert('Resume failed: '+e.message);
    if(btn){btn.disabled=false;btn.textContent=label;}
  }
}

// Shared websocket log pump (same protocol runJob uses).
function _streamJob(jobId,logEl,statusEl,done){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  const ws=new WebSocket(`${proto}//${location.host}/ws/${jobId}`);
  ws.onmessage=e=>{
    if(e.data==='__DONE__'){statusEl.className='job-status done';statusEl.textContent='✓ done';_bnrHide('resume');if(done)done();return;}
    if(e.data==='__ERROR__'){statusEl.className='job-status error';statusEl.textContent='✕ error';_bnrHide('resume');if(done)done();return;}
    logEl.textContent+=e.data+'\n';logEl.scrollTop=logEl.scrollHeight;
  };
  ws.onerror=()=>{statusEl.className='job-status error';statusEl.textContent='connection error';if(done)done();};
}

function updateModels(prefix){
  const prov = document.getElementById(prefix+'-prov').value;
  const models = MODELS[prov] || [];
  ['qm','dm'].forEach(id=>{
    const sel = document.getElementById(prefix+'-'+id);
    if(!sel) return;
    sel.innerHTML = models.map(m=>`<option value="${m}">${m}</option>`).join('');
    if(models.length) sel.value = models[0];
  });
}

function _getAnalysts(prefix){
  const boxes = document.querySelectorAll(`#${prefix}-analysts input[type=checkbox]`);
  return Array.from(boxes).filter(b=>b.checked).map(b=>b.value);
}

async function runJob(type, prefix){
  const logEl    = document.getElementById(prefix+'-log');
  const statusEl = document.getElementById(prefix+'-status');
  const btn      = document.querySelector(`#v-run [onclick="runJob('${type}','${prefix}')"]`);

  logEl.textContent = '';
  logEl.classList.add('active');
  statusEl.style.display = 'inline-flex';
  statusEl.className = 'job-status running';
  statusEl.textContent = '⟳ running';
  btn.disabled = true;

  // Build params
  let params = {};
  const g = id => { const el=document.getElementById(id); return el?el.value:''; };

  if(type === 'screen'){
    params = {
      tickers:     g('sc-tickers'),
      date:        g('sc-date'),
      depth:       g('sc-depth'),
      workers:     g('sc-workers'),
      budget:      g('sc-budget'),
      provider:    g('sc-prov'),
      quick_model: g('sc-qm'),
      deep_model:  g('sc-dm'),
      analysts:    _getAnalysts('sc'),
    };
  } else if(type === 'analyze'){
    params = {
      ticker:      g('an-ticker').toUpperCase(),
      date:        g('an-date'),
      depth:       g('an-depth'),
      provider:    g('an-prov'),
      quick_model: g('an-qm'),
      deep_model:  g('an-dm'),
      analysts:    _getAnalysts('an'),
    };
  } else if(type === 'calibrate'){
    params = { run_name: g('clb-run') };
  } else if(type === 'reflect'){
    params = {
      ticker:      g('rf-ticker').toUpperCase(),
      exit_date:   g('rf-date'),
      provider:    g('rf-prov'),
      quick_model: g('rf-qm'),
      deep_model:  g('rf-dm'),
    };
  } else if(type === 'improve'){
    params = {
      provider:    g('imp-prov'),
      deep_model:  g('imp-dm'),
      quick_model: g('imp-dm'),
    };
  } else if(type === 'allocate'){
    params = {
      run_name:    g('alc-run'),
      date:        g('alc-date'),
      budget:      g('alc-budget'),
      provider:    g('alc-prov'),
      deep_model:  g('alc-dm'),
      quick_model: g('alc-dm'),
    };
  }

  let jobId;
  try {
    const res = await fetch('/api/jobs', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({type, params}),
    });
    if(!res.ok) throw new Error(await res.text());
    ({job_id: jobId} = await res.json());
  } catch(e){
    logEl.textContent = 'Error starting job: ' + e.message;
    statusEl.className = 'job-status error';
    statusEl.textContent = '✕ error';
    btn.disabled = false;
    return;
  }

  _bnrShow(type,jobId);

  // Stream via WebSocket
  if(_activeWs) { try{_activeWs.close();}catch(e){} }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/ws/${jobId}`);
  _activeWs = ws;

  ws.onmessage = e => {
    if(e.data === '__DONE__'){
      _bnrHide(type);
      statusEl.className = 'job-status done';
      statusEl.textContent = '✓ done';
      btn.disabled = false;
      // Refresh screenings data in the background so it's ready when user navigates there
      if(type==='screen'||type==='analyze'||type==='allocate'||type==='resume'){
        _screeningsRefreshing=false;_scrPullRuns();
      }
      return;
    }
    if(e.data === '__ERROR__'){
      _bnrHide(type);
      statusEl.className = 'job-status error';
      statusEl.textContent = '✕ error';
      btn.disabled = false;
      return;
    }
    logEl.textContent += e.data + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  };
  ws.onerror = () => {
    _bnrHide(type);
    statusEl.className = 'job-status error';
    statusEl.textContent = '✕ ws error';
    btn.disabled = false;
  };
}

let _runTab = 'jobs';

function setRunTab(tab) {
  _runTab = tab;
  ['jobs','calendar'].forEach(t => {
    const panel = document.getElementById('run-'+t+'-panel');
    const tabEl = document.getElementById('run-tab-'+t);
    if (panel) panel.style.display = t === tab ? '' : 'none';
    if (tabEl) tabEl.classList.toggle('active', t === tab);
  });
  if (tab === 'calendar') loadCalendar();
}

function fmtMCap(n) {
  if (!n) return '—';
  if (n >= 1e12) return '$'+(n/1e12).toFixed(1)+'T';
  if (n >= 1e9)  return '$'+(n/1e9).toFixed(1)+'B';
  if (n >= 1e6)  return '$'+(n/1e6).toFixed(0)+'M';
  return '$'+n.toLocaleString();
}

function fmtCalDay(s) {
  if (!s) return '—';
  try {
    const d = new Date(s+'T00:00:00');
    return d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'});
  } catch(e) { return s; }
}

function _renderCalendarDays(calData) {
  const days = Object.keys(calData).sort().reverse();
  if (!days.length) return '<div class="empty"><span class="ei">📅</span>No calendar days yet — pick a trading day above and click "Fetch from NASDAQ".</div>';
  return days.map(d => {
    const day = calData[d];
    const entries = day.entries || [];
    const fetchedAt = day.fetched_at ? new Date(day.fetched_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
    const ahDate = day.ah_date || d;
    const pmDate = day.pm_date || '';
    const rows = entries.map(e => {
      const cbId = 'cal-cb-'+d+'-'+e.ticker;
      const sessColor = e.session==='AH'?'var(--accent)':e.session==='PM'?'var(--info)':'var(--dim)';
      return `<tr>
        <td style="width:32px;text-align:center"><input type="checkbox" id="${cbId}" data-calday="${d}" value="${esc(e.ticker)}" checked style="accent-color:var(--accent)"></td>
        <td><strong class="tm">${esc(e.ticker)}</strong></td>
        <td style="color:var(--dim);font-size:11.5px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.company)}</td>
        <td><span style="color:${sessColor};font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em">${esc(e.session)}</span></td>
        <td style="color:var(--dim);font-size:11.5px">${esc(e.time)}</td>
        <td style="color:var(--dim);font-family:var(--mono);font-size:11.5px">${fmtMCap(e.market_cap)}</td>
        <td style="color:var(--dim);font-family:var(--mono);font-size:11.5px">${e.eps_estimate!=null?String(e.eps_estimate):'—'}</td>
        <td style="text-align:center"><button class="cal-remove-btn" onclick="removeCalendarTicker('${d}','${esc(e.ticker)}')" title="Remove">✕</button></td>
      </tr>`;
    }).join('');
    const tableHtml = entries.length
      ? `<div style="overflow-x:auto"><table class="dt"><thead><tr>
          <th style="width:32px;text-align:center"><input type="checkbox" checked onclick="calSelectAll('${d}',this.checked)" title="Select all" style="accent-color:var(--accent)"></th>
          <th>Ticker</th><th>Company</th><th>Session</th><th>Time</th><th>Mkt Cap</th><th>EPS Est.</th><th></th>
        </tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div style="padding:16px 18px;color:var(--muted);font-size:12px">No entries yet. Add tickers below or re-fetch from NASDAQ.</div>`;
    return `<div class="cal-day">
      <div class="cal-day-hd">
        <div style="flex:1">
          <div class="cal-day-title">${fmtCalDay(d)}</div>
          <div class="cal-day-sub">AH: ${fmtCalDay(ahDate)} &nbsp;·&nbsp; PM: ${fmtCalDay(pmDate)} &nbsp;·&nbsp; ${entries.length} companies &nbsp;·&nbsp; fetched ${fetchedAt}</div>
        </div>
        <button class="cal-screen-btn" onclick="screenCalendarDay('${d}')">Screen Selected ▶</button>
      </div>
      ${tableHtml}
      <div class="cal-add-row">
        <input type="text" id="cal-add-${d}" placeholder="Add tickers: AAPL, MSFT, …">
        <button class="ab" onclick="addCalendarTickers('${d}','cal-add-${d}')">Add</button>
      </div>
    </div>`;
  }).join('');
}

async function loadCalendar() {
  const listEl = document.getElementById('cal-days-list');
  if (!listEl) return;
  try {
    const res = await fetch('/api/calendar');
    if (!res.ok) throw new Error(await res.text());
    const calData = await res.json();
    listEl.innerHTML = _renderCalendarDays(calData);
  } catch(e) {
    if (listEl) listEl.innerHTML = `<div class="empty">${esc('Error: '+e.message)}</div>`;
  }
}

async function fetchCalendarDay(dateStr) {
  if (!dateStr) { alert('Please pick a trading day first.'); return; }
  const btn = document.getElementById('cal-fetch-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Fetching…'; }
  try {
    const res = await fetch('/api/calendar/fetch', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({date: dateStr}),
    });
    if (!res.ok) throw new Error(await res.text());
    await loadCalendar();
  } catch(e) {
    alert('Error fetching calendar: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Fetch from NASDAQ'; }
  }
}

async function addCalendarTickers(date, inputId) {
  const inp = document.getElementById(inputId);
  if (!inp || !inp.value.trim()) return;
  const val = inp.value;
  try {
    const res = await fetch('/api/calendar/add', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({date, tickers: val}),
    });
    if (!res.ok) throw new Error(await res.text());
    inp.value = '';
    await loadCalendar();
  } catch(e) {
    alert('Error adding tickers: ' + e.message);
  }
}

async function removeCalendarTicker(date, ticker) {
  try {
    const res = await fetch(`/api/calendar/${date}/${encodeURIComponent(ticker)}`, {method:'DELETE'});
    if (!res.ok) throw new Error(await res.text());
    await loadCalendar();
  } catch(e) {
    alert('Error removing ticker: ' + e.message);
  }
}

// ── Activity banner ────────────────────────────────────────────────────────────
// Keyed by job id, not type, and driven by /api/jobs — which merges this process's
// jobs with the durable registry, so detached runs and jobs that outlived a server
// restart show up here too. Anything running is visible; that is the whole point.
let _bnrDismissed=null;          // signature of the job set the user dismissed
let _bnrActiveJobs=new Map();    // id -> {id,type,label,status,progress,external,run_dir,log_path}
const _bnrLabels={screen:'Screening',analyze:'Analysis',calibrate:'Calibration',reflect:'Reflection',improve:'Improvement',allocate:'Allocation',resume:'Resume'};
let _bnrLogWs=null;

const _bnrSig=()=>[..._bnrActiveJobs.keys()].sort().join(',');
function hideBanner(){_bnrDismissed=_bnrSig();$('run-banner').classList.remove('visible');}

function _bnrShow(type,jobId){
  const id=jobId||('local-'+type);
  _bnrDismissed=null;
  _bnrActiveJobs.set(id,{id:jobId||null,type,label:_bnrLabels[type]||type,status:'running'});
  _bnrUpdate();
}
function _bnrHide(type){
  [..._bnrActiveJobs].forEach(([id,j])=>{if(j.type===type)_bnrActiveJobs.delete(id);});
  _bnrUpdate();
}

function _bnrJobText(j){
  const label=j.label||_bnrLabels[j.type]||j.type;
  const p=j.progress;
  const prog=(p&&p.done!=null)?` ${p.done}${p.total?'/'+p.total:''}${p.pct!=null?` (${p.pct}%)`:''}`:'';
  return label+prog;
}
function _bnrUpdate(){
  const banner=$('run-banner');
  const jobs=[..._bnrActiveJobs.values()];
  if(!jobs.length){banner.classList.remove('visible');return;}
  if(_bnrDismissed===_bnrSig()){banner.classList.remove('visible');return;}
  const stopping=jobs.filter(j=>j.status==='cancelling');
  const verb=stopping.length===jobs.length?'stopping':'running';
  const txt=jobs.length>1
    ? `${jobs.length} jobs ${verb} — ${jobs.map(_bnrJobText).join(' · ')}`
    : `${_bnrJobText(jobs[0])} ${verb}`;
  const tail=jobs.some(j=>j.external)?' — tap for details':' — tap to view log';
  $('bnr-text').textContent=txt+tail;
  // Only jobs the server actually knows by id can be stopped; a local optimistic
  // entry has no id yet.
  const btn=$('bnr-stop');
  if(btn){
    const stoppable=jobs.filter(j=>j.id&&j.status!=='cancelling');
    btn.style.display=stoppable.length?'':'none';
    btn.textContent=stoppable.length>1?`■ Stop…`:'■ Stop';
    btn.disabled=false;
  }
  banner.classList.add('visible');
}

// ── Stopping a job ─────────────────────────────────────────────────────────────
// Cooperative on the server side: queued tickers are never started, in-flight
// ones finish. Say so plainly rather than implying an instant kill.
const _STOP_NOTE='Tickers already in progress finish first (up to a few minutes); nothing new starts.\n\nWhatever finished is kept, and Resume can pick the run up later.';

async function stopJob(id,label,btn){
  if(btn){btn.disabled=true;btn.textContent='Stopping…';}
  try{
    const res=await fetch(`/api/jobs/${encodeURIComponent(id)}/stop`,{method:'POST'});
    const body=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(body.detail||res.status);
    const j=_bnrActiveJobs.get(id);
    if(j){j.status=body.status||'cancelling';_bnrUpdate();}
    _pollJobs();
    return body;
  }catch(e){
    alert(`Could not stop ${label||id}: ${e.message}`);
    if(btn){btn.disabled=false;btn.textContent='■ Stop';}
    return null;
  }
}

function bnrStop(){
  const jobs=[..._bnrActiveJobs.values()].filter(j=>j.id&&j.status!=='cancelling');
  if(!jobs.length)return;
  if(jobs.length>1){openStopPicker(jobs);return;}
  const j=jobs[0],name=_bnrJobText(j);
  if(!confirm(`Stop ${name}?\n\n${_STOP_NOTE}`))return;
  stopJob(j.id,name,$('bnr-stop'));
}

// More than one job in flight — never guess which one the user meant.
function openStopPicker(jobs){
  $('bnr-log-title').textContent='Stop a running job';
  $('bnr-log-status').style.display='none';
  const pre=$('bnr-log-pre');
  pre.style.whiteSpace='normal';
  pre.innerHTML=`<div style="font-family:var(--sans);color:var(--muted);margin-bottom:12px">${esc(_STOP_NOTE).replace(/\n\n/g,'<br><br>')}</div>`
    +jobs.map(j=>`<div class="job-stop-row" id="jsr-${esc(j.id)}">
      <span class="jsr-name">${esc(_bnrJobText(j))}</span>
      <span class="jsr-meta">${j.external?'other process':'this server'}${j.run_dir?' · '+esc(String(j.run_dir).split('/').pop()):''}</span>
      <button class="bnr-stop" style="margin-left:0" onclick="stopJob('${esc(j.id)}','${esc(_bnrJobText(j))}',this)">■ Stop</button>
    </div>`).join('');
  $('bnr-log-modal').classList.add('open');
}

function openBannerLog(){
  const jobs=[..._bnrActiveJobs.values()];
  if(!jobs.length) return;
  const j=jobs.find(x=>x.id&&!x.external)||jobs[0];
  const type=j.type, jobId=j.id;
  const logEl=$('bnr-log-pre');
  logEl.innerHTML='';logEl.style.whiteSpace='pre-wrap';   // reset if the stop picker used it
  $('bnr-log-status').style.display='';
  $('bnr-log-title').textContent=(j.label||_bnrLabels[type]||type)+' Log';
  // A job from another process has no websocket here — show where its log lives.
  if(j.external||!jobId){
    $('bnr-log-status').className='job-status running';
    $('bnr-log-status').textContent=j.status||'running';
    const p=j.progress;
    logEl.textContent=[
      `${j.label||type} — started outside this server process, so its live log is not streamed here.`,
      j.run_dir?`\nrun folder : ${j.run_dir}`:'',
      p&&p.done!=null?`progress   : ${p.done}${p.total?' / '+p.total:''}${p.pct!=null?`  (${p.pct}%)`:''}`:'',
      j.log_path?`log        : tail -f ${j.log_path}`:'',
      j.started_at?`started    : ${new Date(j.started_at).toLocaleString()}`:'',
    ].filter(Boolean).join('\n');
    $('bnr-log-modal').classList.add('open');
    return;
  }
  $('bnr-log-status').className='job-status running';
  $('bnr-log-status').textContent='running';
  logEl.textContent='';
  $('bnr-log-modal').classList.add('open');
  if(_bnrLogWs){try{_bnrLogWs.close();}catch(e){}}
  const proto=location.protocol==='https:'?'wss:':'ws:';
  const ws=new WebSocket(`${proto}//${location.host}/ws/${jobId}`);
  _bnrLogWs=ws;
  ws.onmessage=e=>{
    if(e.data==='__DONE__'){$('bnr-log-status').className='job-status done';$('bnr-log-status').textContent='done';return;}
    if(e.data==='__ERROR__'){$('bnr-log-status').className='job-status error';$('bnr-log-status').textContent='error';return;}
    logEl.textContent+=e.data+'\n';
    logEl.scrollTop=logEl.scrollHeight;
  };
  ws.onerror=()=>{$('bnr-log-status').className='job-status error';$('bnr-log-status').textContent='connection error';};
  ws.onclose=()=>{ if(logEl.textContent&&!logEl.textContent.endsWith('\n')) logEl.textContent+='\n'; };
}
function closeBannerLog(){
  $('bnr-log-modal').classList.remove('open');
  if(_bnrLogWs){try{_bnrLogWs.close();}catch(e){}_bnrLogWs=null;}
}

async function _pollJobs(){
  try{
    const res=await fetch('/api/jobs');
    if(!res.ok)return;
    const jobs=await res.json();
    if(!Array.isArray(jobs))return;
    // `cancelling` still counts as in flight: the work is unwinding, and hiding
    // it would recreate the invisible-run problem the banner exists to prevent.
    const running=jobs.filter(j=>j.status==='running'||j.status==='cancelling');
    // Server list is authoritative: rebuild rather than accumulate, so finished
    // jobs actually clear instead of pinning the banner until a reload.
    const before=_bnrSig();
    const optimistic=[..._bnrActiveJobs].filter(([id])=>id.startsWith('local-'));
    _bnrActiveJobs=new Map(running.map(j=>[j.id,j]));
    // keep a just-submitted local job until the server reports it
    optimistic.forEach(([id,j])=>{if(![..._bnrActiveJobs.values()].some(x=>x.type===j.type))_bnrActiveJobs.set(id,j);});
    if(_bnrSig()!==before&&_bnrDismissed!==_bnrSig())_bnrDismissed=null;  // new work un-dismisses
    _bnrUpdate();
    _resumeBadge(jobs.filter(j=>j.status==='interrupted').length);
  }catch(e){}
}
setInterval(_pollJobs,3000);

// Sidebar hint that something died and can be resumed.
function _resumeBadge(n){
  const el=$('ni-run');if(!el)return;
  let b=el.querySelector('.wl-nav-badge');
  if(!n){if(b)b.remove();return;}
  if(!b){b=document.createElement('span');b.className='wl-nav-badge hot';el.appendChild(b);}
  b.textContent=n;b.title=`${n} interrupted job(s) — resumable from the Run view`;
}

// Signature of everything the watchlist UI actually draws. Repainting when this

  return JSON.stringify((list||[]).map(e=>[e.run_id,e.ticker,e.status,e.current_price,e.distance_pct,e.user_state]));

    const sig=wlSig(fresh),changed=sig!==_wlSig;
    _wlSig=sig;wlData=fresh;wlUpdateBadge();

    <td style="font-size:11px;color:var(--dim)">${date(e.earnings_date)} <span style="color:var(--muted)">(${drop} plan)</span></td>
    <td style="font-size:11px;color:var(--dim);max-width:320px">${esc(e.thesis||'')}</td>
    <td>${wlActsHtml(e)}</td>
  </tr>`;
}

function renderWatchlist(skipRefresh){
  const open=wlOpen();
  const live=open.filter(e=>e.status!=='EXPIRED').sort((a,b)=>(WL_ORDER[a.status]??9)-(WL_ORDER[b.status]??9)||(a.distance_pct??99)-(b.distance_pct??99));
  const expired=open.filter(e=>e.status==='EXPIRED');
  const bought=wlData.filter(e=>e.user_state==='purchased');
  const dropped=wlData.filter(e=>e.user_state==='dismissed');
  const hdr=`<thead><tr><th>Ticker</th><th>Status</th><th>Trigger</th><th>Now</th><th>Distance</th><th>Reserved</th><th>Window</th><th>Earnings</th><th>Entry Thesis</th><th>Actions</th></tr></thead>`;
  const tbl=rows=>`<div class="tw"><div style="overflow-x:auto"><table class="dt">${hdr}<tbody>${rows.map(wlRow).join('')}</tbody></table></div></div>`;
  const fold=(id,title,rows)=>!rows.length?'':`
<div class="section" style="margin-top:18px">
  <div class="sec-hd" style="cursor:pointer" onclick="const b=$('${id}');b.style.display=b.style.display==='none'?'':'none'">
    <div class="sec-title" style="color:var(--muted)">${title} (${rows.length}) — click to toggle</div>
  </div>
  <div id="${id}" style="display:none">${tbl(rows)}</div>
</div>`;
  $('v-watchlist').innerHTML=`
<div class="ph"><h2>Watchlist</h2><p>Conditional "wait &amp; decide" entries — skip the print, buy the dislocation at the trigger. Flag-only: place orders manually, then mark the row Purchased.</p></div>
${live.length?tbl(live)
  :`<div style="padding:40px;text-align:center;color:var(--muted)">No active watch entries. The council adds WATCH rows for quality names whose pre-print entry is unattractive.</div>`}
${fold('wl-purchased','Purchased',bought)}
${fold('wl-expired','Expired',expired)}
${fold('wl-dismissed','Dismissed',dropped)}`;
  if(!skipRefresh)wlRefresh(()=>{if(currentView()==='watchlist')renderWatchlist(true);});
}

// Keep the overview's TRIGGERED strip honest without a reload — a dislocation
// entry going live is the one thing worth surfacing unprompted. Cheap now: the
// server answers from a warm snapshot (~1 ms) and we repaint only on a change.
setInterval(()=>{
  if(!usePath||currentView()==='watchlist')return;   // wlAutoRefresh owns that view
  wlRefresh(()=>{if(currentView()==='overview')wlPaintAlert();});
},60000);

// Keep the "Now" column honest while the view is open (quotes are TTL-cached server-side).
function wlAutoRefresh(on){
  if(wlTimer){clearInterval(wlTimer);wlTimer=null;}
  if(on&&usePath)wlTimer=setInterval(()=>{
    if(currentView()!=='watchlist'){wlAutoRefresh(false);return;}
    wlRefresh(()=>renderWatchlist(true));
  },60000);
}

// Repaint just the alert strip in place of a full renderOverview().
function wlPaintAlert(){const el=$('wl-alert-slot');if(el)el.innerHTML=wlAlertHtml();}

function wlAlertHtml(){
  const hot=wlOpen().filter(e=>e.status==='TRIGGERED');
  if(!hot.length)return'';   // slot stays in the DOM — nothing shifts when it fills
  const names=hot.map(e=>`${esc(e.ticker)} ≤ $${e.trigger_price!=null?e.trigger_price.toFixed(2):'?'}`).join(' · ');
  return`<div class="wl-alert" onclick="go('watchlist')"><span class="badge b-triggered">▲ TRIGGERED</span><span style="flex:1">${names} — dislocation entry live, review now</span><span style="color:var(--loss);font-weight:700">Open Watchlist →</span></div>`;
}

// ── DeepSeek peak / off-peak pricing ──────────────────────────────────────────
// api-docs.deepseek.com/quick_start/pricing/ — "Peak hours are 01:00 - 04:00 and
// 06:00 - 10:00 UTC, Monday through Friday (all other hours are off-peak)."
// Off-peak is half price, so a screen run in peak hours costs exactly double.
// v4-flash $0.44/$1.32 per Mtok peak vs $0.22/$0.66 off; v4-pro $1.32/$3.96 vs
// $0.66/$1.98. All computed in UTC — never local time, which drifts with DST.
const DS_PEAK_UTC=[[1,4],[6,10]];   // [startHour, endHour) UTC, weekdays only

function dsIsPeak(d){
  const day=d.getUTCDay();
  if(day===0||day===6)return false;            // weekends are entirely off-peak
  const h=d.getUTCHours()+d.getUTCMinutes()/60;
  return DS_PEAK_UTC.some(([a,b])=>h>=a&&h<b);
}

// Next state flip. Minute-stepping rather than closed-form: the windows are
// small and the weekend gap makes the arithmetic fiddly to get right, and the
// worst case (Friday 10:00 UTC → Monday 01:00) is only ~3,800 cheap iterations.
function dsNextFlip(from){
  const cur=dsIsPeak(from);
  let t=new Date(from.getTime()); t.setUTCSeconds(0,0);
  for(let i=0;i<60*24*4;i++){
    t=new Date(t.getTime()+60000);
    if(dsIsPeak(t)!==cur)return t;
  }
  return null;
}

function dsGap(ms){
  const m=Math.max(0,Math.round(ms/60000)),h=Math.floor(m/60);
  if(h>=24)return `${Math.floor(h/24)}d ${h%24}h`;
  return h?`${h}h ${m%60}m`:`${m}m`;
}

function dsRender(){
  const el=$('ds-pricing'); if(!el)return;
  const now=new Date(), peak=dsIsPeak(now), next=dsNextFlip(now);
  const when=next?` · ${peak?'ends':'starts'} in ${dsGap(next-now)}`:'';
  const at=next?next.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
  el.className='ds-pill '+(peak?'ds-peak':'ds-off');
  el.innerHTML=`<strong>DeepSeek · ${peak?'peak':'off-peak'}</strong>`
    +`<span>${peak?'2× price':'half price'}${peak?when:` · peak${when.replace(' · starts','')}`}`
    +`${at?` (${at})`:''}</span>`;
  el.title='DeepSeek peak hours: 01:00-04:00 and 06:00-10:00 UTC, Mon-Fri.\n'
    +'All other hours, and all weekend, are off-peak at half price.\n'
    +(peak?'Screening now costs double — consider waiting.':'Cheapest time to screen.');
  document.querySelectorAll('.ds-warn-slot').forEach(x=>x.innerHTML=dsWarnHtml());
}

// Only nags where it matters — the two views that launch screens, and only
// while peak pricing is actually in force.
function dsWarnHtml(){
  if(!dsIsPeak(new Date()))return'';
  const n=dsNextFlip(new Date());
  return`<div class="ds-warn"><strong>DeepSeek peak pricing</strong>`
    +`<span style="flex:1;color:var(--muted)">Every call costs 2× until off-peak resumes`
    +`${n?` in ${dsGap(n-new Date())}`:''}. Screening now is twice the price.</span></div>`;
}
setInterval(dsRender,30000);

// ── Boot ──────────────────────────────────────────────────────────────────────
function render(v){
  if(v==='overview')    renderOverview();
  if(v==='screenings')  renderScreenings();
  if(v==='analyses')    renderAnalyses();
  if(v==='watchlist')   renderWatchlist();
  wlAutoRefresh(v==='watchlist');
  if(v==='trades')      renderTrades();
  if(v==='reflections') renderReflections();
  if(v==='performance') renderPerformance();
  if(v==='run')         renderRun();
}

document.addEventListener('DOMContentLoaded',()=>{
  const ts=DATA.generated_at?new Date(DATA.generated_at).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
  $('gen-ts').textContent=ts;
  wlUpdateBadge();
  dsRender();
  applyView(currentView());   // honor /screenings (or #screenings) on initial load / reload
  _pollJobs();
  // Confirm watchlist statuses against the server (the embed is a warm snapshot,
  // so this is normally a no-op). Only the alert slot is repainted — rebuilding
  // the whole overview to insert one strip re-created every chart below it.
  wlRefresh(()=>{if(currentView()==='overview')wlPaintAlert();else if(currentView()==='watchlist')renderWatchlist(true);});
});
</script>
