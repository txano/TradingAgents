<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradingAgents Reports</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;
  --surface:#13161e;
  --card:#1a1d28;
  --hover:#1f2235;
  --elevated:#222538;
  --border:rgba(255,255,255,0.06);
  --border2:rgba(255,255,255,0.11);
  --text:#e9e7e1;
  --dim:#8a8b9c;
  --muted:#50516a;
  --accent:#cf6e44;
  --accent-dim:#a85530;
  --accent-bg:rgba(207,110,68,0.09);
  --accent-border:rgba(207,110,68,0.22);
  --win:#4ade80;
  --win-bg:rgba(74,222,128,0.07);
  --win-border:rgba(74,222,128,0.2);
  --loss:#f87171;
  --loss-bg:rgba(248,113,113,0.07);
  --loss-border:rgba(248,113,113,0.2);
  --warn:#fbbf24;
  --warn-bg:rgba(251,191,36,0.07);
  --warn-border:rgba(251,191,36,0.2);
  --info:#60a5fa;
  --font:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',system-ui,sans-serif;
  --mono:'SF Mono','JetBrains Mono','Fira Code',monospace;
  --sidebar-w:224px;
  --r:11px;--r-sm:7px;--r-xs:5px;
}
html{font-size:14px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;line-height:1.55}

/* ── Sidebar ─────────────────────────────────────────────── */
#sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:10}
.logo{padding:22px 18px 18px;border-bottom:1px solid var(--border)}
.logo-mark{width:33px;height:33px;background:linear-gradient(135deg,var(--accent) 0%,#8a3515 100%);border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:11px;box-shadow:0 3px 18px rgba(207,110,68,0.22);font-size:16px;font-weight:800;color:rgba(255,255,255,0.9);letter-spacing:-.5px;font-family:var(--mono)}
.logo h1{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--text);line-height:1.2}
.logo p{font-size:10.5px;color:var(--muted);margin-top:3px}
.nav{flex:1;padding:10px 0;overflow-y:auto}
.nav-sep{padding:13px 16px 5px;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 16px;cursor:pointer;color:var(--dim);font-size:12.5px;font-weight:500;transition:all .12s;border-left:2px solid transparent;margin:1px 6px;border-radius:0 var(--r-sm) var(--r-sm) 0;user-select:none}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.nav-item.active{color:var(--accent);background:var(--accent-bg);border-left-color:var(--accent);font-weight:600}
.nav-icon{font-size:12px;width:15px;text-align:center;flex-shrink:0}
.sidebar-footer{padding:13px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--muted)}
.sidebar-footer strong{color:var(--dim);display:block;margin-bottom:2px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
/* DeepSeek peak / off-peak pricing indicator */
.ds-pill{margin:0 12px 10px;padding:8px 11px;border-radius:var(--r-sm);border:1px solid;font-size:10.5px;line-height:1.45;cursor:default}
.ds-pill strong{display:block;font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.ds-pill span{display:block;color:var(--muted)}
.ds-off{background:var(--win-bg);border-color:var(--win-border);color:var(--win)}
.ds-peak{background:var(--loss-bg);border-color:var(--loss-border);color:var(--loss)}
.ds-warn{display:flex;align-items:center;gap:10px;background:var(--loss-bg);border:1px solid var(--loss-border);border-radius:var(--r);padding:11px 16px;margin-bottom:16px;font-size:12.5px;color:var(--loss)}

/* ── Main ──────────────────────────────────────────────────── */
#main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;min-width:0}
.view{display:none;padding:38px 46px}
.view.active{display:block}

/* ── Page header ───────────────────────────────────────────── */
.ph{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border)}
.ph h2{font-size:22px;font-weight:700;letter-spacing:-.5px;color:var(--text)}
.ph p{color:var(--dim);font-size:12.5px;margin-top:4px;line-height:1.45}

/* ── Stat grid ─────────────────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;transition:border-color .18s}
.stat:hover{border-color:var(--border2)}
.stat-label{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.stat-value{font-size:25px;font-weight:800;letter-spacing:-.7px;line-height:1;font-family:var(--mono)}
.stat-sub{font-size:10.5px;color:var(--dim);margin-top:5px;line-height:1.35}

/* ── Section ───────────────────────────────────────────────── */
.section{margin-bottom:32px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--text)}
.sec-title::before{content:'';display:inline-block;width:2.5px;height:12px;background:var(--accent);border-radius:2px}
.see-all{font-size:11px;color:var(--accent);cursor:pointer;font-weight:500;opacity:.85}
.see-all:hover{opacity:1}

/* ── List card ─────────────────────────────────────────────── */
.lc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 16px;cursor:pointer;transition:all .14s;margin-bottom:7px;display:flex;align-items:center;gap:13px}
.lc:hover{border-color:var(--border2);background:var(--hover)}
.lc-icon{font-size:13px;width:34px;height:34px;border-radius:8px;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)}
.lc-body{flex:1;min-width:0}
.lc-title{font-size:13px;font-weight:600;color:var(--text)}
.lc-sub{font-size:11px;color:var(--dim);margin-top:2px}
.lc-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}

/* ── Badges ────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;border:1px solid transparent}
.b-win{background:var(--win-bg);color:var(--win);border-color:var(--win-border)}
.b-loss{background:var(--loss-bg);color:var(--loss);border-color:var(--loss-border)}
.b-buy{background:var(--win-bg);color:var(--win);border-color:var(--win-border)}
.b-short{background:var(--loss-bg);color:var(--loss);border-color:var(--loss-border)}
.b-skip{background:rgba(255,255,255,0.05);color:var(--dim);border-color:rgba(255,255,255,0.08)}
.b-high{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-border)}
.b-medium{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}
.b-low{background:rgba(255,255,255,0.05);color:var(--dim);border-color:rgba(255,255,255,0.08)}

/* ── Watchlist (#19) ───────────────────────────────────────── */
.b-triggered{background:var(--loss-bg);color:var(--loss);border-color:var(--loss-border);animation:wlPulse 1.6s ease-in-out infinite}
.b-armed{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}
.b-pending{background:rgba(255,255,255,0.05);color:var(--dim);border-color:rgba(255,255,255,0.08)}
.b-expired{background:transparent;color:var(--muted);border-color:rgba(255,255,255,0.06)}
@keyframes wlPulse{0%,100%{opacity:1}50%{opacity:.55}}
.wl-nav-badge{margin-left:auto;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border);border-radius:9px;font-size:9.5px;font-weight:700;padding:1px 7px;font-family:var(--mono)}
.wl-nav-badge.hot{background:var(--loss-bg);color:var(--loss);border-color:var(--loss-border)}
.wl-alert{display:flex;align-items:center;gap:10px;background:var(--loss-bg);border:1px solid var(--loss-border);border-radius:var(--r);padding:11px 16px;margin-bottom:16px;cursor:pointer;font-size:12.5px}
.wl-alert:hover{filter:brightness(1.15)}
.wl-dist-ok{color:var(--dim);font-family:var(--mono)}
.wl-dist-close{color:var(--warn);font-family:var(--mono);font-weight:700}
.wl-dist-hit{color:var(--loss);font-family:var(--mono);font-weight:700}
.b-purchased{background:var(--win-bg);color:var(--win);border-color:var(--win-border)}
.b-dismissed{background:transparent;color:var(--muted);border-color:rgba(255,255,255,0.06)}
.wl-acts{display:flex;gap:5px;white-space:nowrap}
.wl-btn{background:rgba(255,255,255,0.05);color:var(--dim);border:1px solid var(--border2);border-radius:var(--r-sm);padding:3px 9px;font-size:10.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .13s}
.wl-btn:hover{background:rgba(255,255,255,0.1);color:var(--text)}
.wl-btn:disabled{opacity:.4;cursor:wait}
.wl-btn.buy:hover{background:var(--win-bg);color:var(--win);border-color:var(--win-border)}
.wl-btn.del:hover{background:var(--loss-bg);color:var(--loss);border-color:var(--loss-border)}
.wl-live{color:var(--win);font-size:8px;vertical-align:middle;margin-left:4px}
.wl-stale{color:var(--muted);font-size:8px;vertical-align:middle;margin-left:4px}
.b-neutral,.b-break_even{background:rgba(255,255,255,0.05);color:var(--dim);border-color:rgba(255,255,255,0.08)}

/* ── Data table ────────────────────────────────────────────── */
.tw{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.dt{width:100%;border-collapse:collapse;font-size:12.5px}
.dt th{text-align:left;padding:9px 12px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:rgba(0,0,0,0.18);border-bottom:1px solid var(--border)}
.dt td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.dt tr:last-child td{border-bottom:none}
.dt tr:hover td{background:rgba(255,255,255,0.025)}
.dt .row-buy td{background:rgba(74,222,128,0.028)}
.dt .row-buy:hover td{background:rgba(74,222,128,0.055)}
.dt .row-short td{background:rgba(248,113,113,0.028)}
.dt .row-short:hover td{background:rgba(248,113,113,0.055)}
.tr{text-align:right}.tm{font-family:var(--mono)}
.dt td.num{text-align:right;font-family:var(--mono);font-size:12px}
.one-liner-cell{max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim);font-size:11.5px}

/* ── Screening cards ───────────────────────────────────────── */
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;transition:border-color .15s}
.sc:hover{border-color:var(--border2)}
.sc-hd{display:flex;align-items:center;gap:14px;padding:15px 20px;cursor:pointer;user-select:none}
.sc-date{font-size:14.5px;font-weight:700;color:var(--text);flex-shrink:0;min-width:106px;letter-spacing:-.3px}
.sc-meta{flex:1}
.sc-actions{display:flex;gap:7px;flex-shrink:0;align-items:center}
.sc-body{display:none}
.ab{padding:5px 11px;border-radius:var(--r-xs);font-size:10.5px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--dim);transition:all .14s;letter-spacing:.01em}
.ab:hover{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-border)}
.chevron{color:var(--muted);font-size:9px;transition:transform .2s;margin-left:2px}

/* ── Screening table (inline) ──────────────────────────────── */
.sc-table-wrap{border-top:1px solid var(--border);overflow-x:auto}
.sc-table-wrap .dt{font-size:12px}
.sc-table-wrap .dt td,.sc-table-wrap .dt th{padding:8px 11px}
.sc-table-wrap .dt .one-liner-cell{max-width:280px}
.sc-briefs-section{padding:14px 20px 16px;border-top:1px solid var(--border)}
.sc-section-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:9px}
.sc-alloc-section{padding:12px 20px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}

/* ── Ticker chips ──────────────────────────────────────────── */
.chip{display:inline-flex;align-items:center;padding:3px 8px;border-radius:var(--r-xs);font-size:10.5px;font-weight:700;font-family:var(--mono);margin:2px 3px 2px 0;cursor:pointer;border:1px solid transparent;transition:all .14s;letter-spacing:.03em}
.chip:hover{transform:translateY(-1px);box-shadow:0 3px 12px rgba(0,0,0,0.25)}
.chip.buy{background:var(--win-bg);color:var(--win);border-color:var(--win-border)}
.chip.short{background:var(--loss-bg);color:var(--loss);border-color:var(--loss-border)}
.chip.skip,.chip{background:rgba(255,255,255,0.05);color:var(--dim);border-color:rgba(255,255,255,0.08)}

/* ── Score bars (overlay) ──────────────────────────────────── */
.score-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:18px 22px;background:rgba(0,0,0,0.18);border-bottom:1px solid var(--border)}
.score-item{text-align:center}
.score-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:6px}
.score-num{font-size:21px;font-weight:800;font-family:var(--mono);line-height:1}
.score-track{width:50px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;margin-top:7px;overflow:hidden}
.score-fill{height:100%;border-radius:2px;background:var(--accent)}
.score-fill.positive{background:var(--win)}
.score-fill.negative{background:var(--loss)}
.score-signals{display:flex;flex-direction:column;gap:5px;margin-left:auto}

/* ── Overlay ───────────────────────────────────────────────── */
#ov{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:none;justify-content:flex-end;backdrop-filter:blur(5px)}
#ov.open{display:flex}
#op{width:min(860px,92vw);background:var(--surface);height:100vh;display:flex;flex-direction:column;box-shadow:-24px 0 72px rgba(0,0,0,0.55);animation:slideIn .2s ease;border-left:1px solid var(--border)}
@keyframes slideIn{from{transform:translateX(36px);opacity:0}to{transform:translateX(0);opacity:1}}
#oh{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border);flex-shrink:0;gap:12px;background:rgba(0,0,0,0.12)}
#ot{font-size:13.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.1px}
#oc{width:28px;height:28px;border-radius:6px;background:rgba(255,255,255,0.05);border:1px solid var(--border);cursor:pointer;color:var(--dim);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .14s;flex-shrink:0}
#oc:hover{color:var(--text);background:rgba(255,255,255,0.08);border-color:var(--border2)}
#ob{flex:1;overflow-y:auto;padding:0}

/* ── PM decision band ──────────────────────────────────────── */
.pm-header{padding:10px 22px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);background:var(--accent-bg);border-bottom:1px solid var(--accent-border)}
.pm-body{padding:20px 24px}
.brief-header{padding:10px 22px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);background:rgba(255,255,255,0.03);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}

/* ── Markdown body ─────────────────────────────────────────── */
.md-body{color:var(--text);line-height:1.7;font-size:13px;padding:20px 24px}
.md-body h1{font-size:17px;font-weight:700;margin:0 0 14px;color:var(--text);letter-spacing:-.3px}
.md-body h2{font-size:14px;font-weight:700;margin:22px 0 9px;padding-bottom:7px;border-bottom:1px solid var(--border);color:var(--text)}
.md-body h3{font-size:13px;font-weight:600;margin:18px 0 7px;color:var(--accent)}
.md-body p{color:var(--dim);margin-bottom:10px}
.md-body strong{color:var(--text);font-weight:600}
.md-body em{font-style:italic}
.md-body ul,.md-body ol{padding-left:18px;margin-bottom:10px;color:var(--dim)}
.md-body li{margin-bottom:3px;line-height:1.6}
.md-body code{background:rgba(255,255,255,0.07);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.md-body pre{background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px;overflow-x:auto;margin-bottom:13px}
.md-body pre code{background:none;padding:0;color:var(--dim);font-size:11.5px}
.md-body blockquote{border-left:3px solid var(--accent);padding:7px 14px;margin:12px 0;color:var(--dim);background:var(--accent-bg);border-radius:0 var(--r-sm) var(--r-sm) 0;font-style:italic}
.md-body hr{border:none;border-top:1px solid var(--border);margin:18px 0}
.md-body a{color:var(--accent);text-decoration:none}
.md-body table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:12px}
.md-body th{background:rgba(0,0,0,0.2);padding:7px 11px;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--border)}
.md-body td{padding:7px 11px;border-bottom:1px solid var(--border);color:var(--dim)}
.md-body tr:last-child td{border-bottom:none}

/* ── Filters ───────────────────────────────────────────────── */
.filters{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.fi{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);padding:6px 11px;font-size:12px;font-family:var(--font);outline:none;transition:border-color .14s}
.fi:focus{border-color:var(--accent)}
.fi::placeholder{color:var(--muted)}
.fb{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--dim);padding:6px 12px;font-size:11.5px;font-weight:500;cursor:pointer;transition:all .14s}
.fb:hover,.fb.on{border-color:var(--accent-border);color:var(--accent);background:var(--accent-bg)}

/* ── Reflection grid ───────────────────────────────────────── */
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:10px}
.rc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px 17px;cursor:pointer;transition:all .14s}
.rc:hover{border-color:var(--border2);background:var(--hover)}
.rc-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.rc-ticker{font-size:15.5px;font-weight:800;font-family:var(--mono);letter-spacing:-.2px}
.rc-date{font-size:10.5px;color:var(--muted);margin-top:2px}
.rc-lesson{font-size:11.5px;color:var(--dim);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ── Performance ───────────────────────────────────────────── */
.day-row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--border);font-size:12.5px}
.day-row:last-child{border-bottom:none}
.day-bar-wrap{flex:1;height:5px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden;max-width:200px}
.day-bar{height:100%;border-radius:3px;background:var(--accent)}
.bench-row{display:flex;align-items:center;gap:0;padding:11px 16px;border-bottom:1px solid var(--border);border-left:2px solid transparent}
.bench-row:last-child{border-bottom:none}
.bench-name{font-weight:700;font-size:12.5px;width:52px;flex-shrink:0}
.bench-prices{font-family:var(--mono);font-size:11px;color:var(--dim);flex:1}
.bench-ret,.bench-pnl{font-family:var(--mono);font-size:12px;width:88px;text-align:right;flex-shrink:0}
.bench-diff{font-size:11px;font-weight:600;width:104px;text-align:right;flex-shrink:0}

/* ── Misc ──────────────────────────────────────────────────── */
.empty{text-align:center;padding:52px 24px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.empty .ei{font-size:30px;margin-bottom:11px;display:block;opacity:.4}
.divider{border:none;border-top:1px solid var(--border);margin:24px 0}
.c-win{color:var(--win)}.c-loss{color:var(--loss)}.c-warn{color:var(--warn)}.c-accent{color:var(--accent)}.c-dim{color:var(--dim)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.09);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.16)}

/* ── Run tab ───────────────────────────────────────────────── */
.run-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:28px}
.run-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px}
.run-card h3{font-size:13px;font-weight:700;letter-spacing:-.2px;margin-bottom:4px;color:var(--text)}
.run-card p{font-size:11.5px;color:var(--dim);margin-bottom:18px;line-height:1.45}
.run-card.full{grid-column:1/-1}
label{display:block;font-size:11px;font-weight:600;color:var(--dim);margin-bottom:5px;letter-spacing:.04em;text-transform:uppercase}
input[type=text],input[type=date],input[type=number],select{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-xs);color:var(--text);font-size:12.5px;padding:7px 10px;font-family:var(--font);outline:none;transition:border-color .14s}
input[type=text]:focus,input[type=date]:focus,input[type=number]:focus,select:focus{border-color:var(--accent)}
select option{background:var(--surface)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.form-field{margin-bottom:12px}
.checkrow{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.checkrow label{display:flex;align-items:center;gap:5px;text-transform:none;letter-spacing:0;font-size:12px;font-weight:500;color:var(--text);cursor:pointer}
.checkrow input[type=checkbox]{width:auto;accent-color:var(--accent)}
.btn-run{background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);padding:9px 20px;font-size:12.5px;font-weight:700;cursor:pointer;transition:background .14s;letter-spacing:.02em}
.btn-run:hover{background:var(--accent-dim)}
.btn-run:disabled{opacity:.45;cursor:not-allowed}
.job-log{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);font-family:var(--mono);font-size:11.5px;color:var(--dim);padding:14px 16px;min-height:200px;max-height:500px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;margin-top:16px;display:none}
.job-log.active{display:block}
.job-status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;margin-left:12px;vertical-align:middle}
.job-status.running{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border)}
.job-status.done{background:var(--win-bg);color:var(--win);border:1px solid var(--win-border)}
.job-status.error{background:var(--loss-bg);color:var(--loss);border:1px solid var(--loss-border)}

/* ── Performance dashboard ─────────────────────────────────── */
.dp-6col{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.dp-5col{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.dp-4col{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.dp-2fr1{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.dp-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.dp-chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px}
.dp-chart-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dp-chart-title{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.dp-chart-wrap{position:relative;height:210px}
.dp-pill{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;flex-shrink:0}
.dp-pill button{padding:4px 12px;border:none;background:transparent;color:var(--dim);cursor:pointer;font-size:11px;font-weight:500;transition:background .15s,color .15s}
.dp-pill button.active{background:var(--accent);color:#fff}
.dp-pill button:not(.active):hover{color:var(--text)}
.dp-filter-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;margin-bottom:14px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.dp-fg{display:flex;flex-direction:column;gap:4px}
.dp-fg label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:0}
.dp-fg input,.dp-fg select{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 10px;font-size:12.5px;outline:none;font-family:var(--font);width:auto}
.dp-fg input:focus,.dp-fg select:focus{border-color:var(--accent)}
.dp-fg input[type=date]{width:138px;color-scheme:dark}
.dp-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;font-size:12px;transition:border-color .15s,color .15s}
.dp-btn:hover{border-color:var(--text);color:var(--text)}
.dp-tbl-top{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.dp-tbl-top h3{font-size:13px;font-weight:600}
.dt th.asc::after{content:" ↑"}.dt th.desc::after{content:" ↓"}
@media(max-width:1400px){.dp-6col{grid-template-columns:repeat(3,1fr)}.dp-5col{grid-template-columns:repeat(3,1fr)}.dp-2fr1{grid-template-columns:1fr}}
@media(max-width:1000px){.dp-4col{grid-template-columns:repeat(2,1fr)}.dp-2col{grid-template-columns:1fr}}
@media(max-width:768px){.dp-6col{grid-template-columns:repeat(2,1fr)}.dp-5col{grid-template-columns:repeat(2,1fr)}}

/* ── Calendar sub-tab ──────────────────────────────────────── */
.run-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:24px}
.run-tab{padding:9px 22px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--dim);border-bottom:2px solid transparent;transition:color .14s,border-color .14s;margin-bottom:-1px;user-select:none}
.run-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.run-tab:hover:not(.active){color:var(--text)}
.cal-fetch-bar{display:flex;gap:12px;align-items:flex-end;margin-bottom:20px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;flex-wrap:wrap}
.cal-day{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.cal-day-hd{display:flex;align-items:center;gap:14px;padding:14px 18px;background:rgba(0,0,0,0.12);border-bottom:1px solid var(--border)}
.cal-day-title{font-size:15px;font-weight:700;letter-spacing:-.3px;font-family:var(--mono)}
.cal-day-sub{font-size:11px;color:var(--dim);margin-top:3px}
.cal-add-row{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--border);background:rgba(0,0,0,0.06);align-items:center;flex-wrap:wrap}
.cal-add-row input{flex:1;max-width:360px;background:var(--surface);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:6px 10px;font-size:12.5px;outline:none;font-family:var(--font);transition:border-color .14s}
.cal-add-row input:focus{border-color:var(--accent)}
.cal-remove-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:2px 6px;border-radius:3px;transition:color .13s;line-height:1}
.cal-remove-btn:hover{color:var(--loss)}
.cal-screen-btn{background:var(--accent);color:#fff;border:none;border-radius:var(--r-xs);padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;transition:background .14s;flex-shrink:0}
.cal-screen-btn:hover{background:var(--accent-dim)}

/* ── Screen modal ──────────────────────────────────────────── */
#scr-modal{position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:300;display:none;justify-content:center;align-items:center;backdrop-filter:blur(5px)}
#scr-mc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);width:min(660px,92vw);max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;box-shadow:0 24px 72px rgba(0,0,0,0.5);animation:slideIn .2s ease}
#scr-mh{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border);flex-shrink:0;background:rgba(0,0,0,0.1)}
#scr-mt{font-size:14px;font-weight:700;letter-spacing:-.2px;flex:1}
#scr-mb{padding:22px 24px;flex:1}
.scr-close{width:28px;height:28px;border-radius:6px;background:rgba(255,255,255,0.05);border:1px solid var(--border);cursor:pointer;color:var(--dim);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .14s;flex-shrink:0}
.scr-close:hover{color:var(--text);background:rgba(255,255,255,0.08);border-color:var(--border2)}

/* ── Activity banner ───────────────────────────────────────── */
#run-banner{position:fixed;top:0;left:var(--sidebar-w);right:0;z-index:50;padding:7px 18px;display:flex;align-items:center;gap:9px;font-size:12px;font-weight:600;background:rgba(251,191,36,0.13);border-bottom:1px solid var(--warn-border);color:var(--warn);backdrop-filter:blur(8px);transform:translateY(-100%);transition:transform .22s ease;pointer-events:none}
#run-banner.visible{transform:translateY(0);pointer-events:auto}
.bnr-dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex-shrink:0;animation:bnrpulse 1.3s infinite}
@keyframes bnrpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.bnr-close{background:none;border:none;color:var(--warn);cursor:pointer;font-size:14px;opacity:.65;line-height:1;padding:2px 5px;border-radius:3px;flex-shrink:0}
.bnr-close:hover{opacity:1}
.bnr-stop{margin-left:auto;background:rgba(248,113,113,0.14);border:1px solid var(--loss-border);color:var(--loss);cursor:pointer;font-size:10.5px;font-weight:700;line-height:1;padding:4px 9px;border-radius:4px;flex-shrink:0;letter-spacing:.02em}
.bnr-stop:hover:not(:disabled){background:rgba(248,113,113,0.26)}
.bnr-stop:disabled{opacity:.5;cursor:default}
.job-stop-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r);margin-bottom:7px;font-size:12px}
.job-stop-row .jsr-name{flex:1;font-weight:600}
.job-stop-row .jsr-meta{color:var(--dim);font-size:11px}
#bnr-text{cursor:pointer;flex:1;text-underline-offset:2px}
#bnr-text:hover{text-decoration:underline dotted}

/* ── Banner log modal ──────────────────────────────────────── */
#bnr-log-modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center}
#bnr-log-modal.open{display:flex}
#bnr-log-box{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);width:min(700px,94vw);max-height:82vh;display:flex;flex-direction:column;box-shadow:0 24px 72px rgba(0,0,0,0.55);animation:slideIn .18s ease;overflow:hidden}
#bnr-log-hd{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border);flex-shrink:0;background:rgba(0,0,0,0.12)}
#bnr-log-pre{flex:1;overflow-y:auto;padding:14px 18px;font-size:11.5px;font-family:var(--mono);white-space:pre-wrap;word-break:break-all;color:var(--dim);margin:0;background:rgba(0,0,0,0.22);line-height:1.55;min-height:120px}

/* ── Mobile sidebar ────────────────────────────────────────── */
#mob-toggle{display:none;position:fixed;top:11px;left:12px;z-index:100;background:var(--card);border:1px solid var(--border2);border-radius:7px;width:36px;height:36px;align-items:center;justify-content:center;cursor:pointer;font-size:17px;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,0.3)}
#mob-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.52);z-index:9;backdrop-filter:blur(2px)}

@media(max-width:700px){
  html,body{overflow-x:hidden}
  :root{--sidebar-w:0px}
  #sidebar{transform:translateX(-100%);transition:transform .22s ease;z-index:15;width:230px}
  #sidebar.mob-open{transform:translateX(0)}
  #mob-bg{display:block;opacity:0;pointer-events:none;transition:opacity .22s}
  #mob-bg.mob-open{opacity:1;pointer-events:auto}
  #mob-toggle{display:flex}
  #main{margin-left:0;min-width:0}
  canvas{max-width:100%}
  #run-banner{left:0}
  .view{padding:54px 14px 28px 60px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .run-grid{grid-template-columns:1fr}
  .run-card.full{grid-column:1}
  .form-row,.form-row-3{grid-template-columns:1fr}
  .sc-hd{flex-wrap:wrap;gap:8px}
  .sc-actions{width:100%;justify-content:flex-end}
  .ph h2{font-size:18px}
  .ph{margin-bottom:20px;padding-bottom:16px}
  .tw,.sc-table-wrap{overflow-x:auto}
  .cal-fetch-bar{flex-direction:column;gap:8px;align-items:stretch}
  .cal-fetch-bar .dp-fg{width:100%}
  .cal-fetch-bar .dp-fg input{width:100%}
  .filters{gap:5px}
  .fi{font-size:13px}
  .dp-filter-bar{flex-direction:column;gap:8px}
  .dp-2fr1,.dp-2col{grid-template-columns:1fr}
  .lc{gap:9px}
  .lc-meta{flex-direction:row;align-items:center;gap:6px}
  #scr-mc{width:96vw;max-height:92vh}
  #op{width:100vw}
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js" crossorigin="anonymous" onerror="window.marked=null"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ── Injected data ──────────────────────────────────────────────────────────
const DATA = __TRADINGAGENTS_DATA__;

// ── Utilities ──────────────────────────────────────────────────────────────
const $=id=>document.getElementById(id);

function md(t){
  if(!t)return'<p style="padding:20px 24px;color:var(--dim)">No content available.</p>';
  let html;
  if(window.marked){try{html=marked.parse(t)}catch(e){html=null}}
  if(!html)html=`<pre style="white-space:pre-wrap;font-size:12px;color:var(--dim);line-height:1.65;padding:20px 24px">${esc(t)}</pre>`;
  return`<div class="md-body">${html}</div>`;
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function cur(n,compact=false){
  if(n==null)return'—';
  const a=Math.abs(n),s=n<0?'-':'+';
  if(compact){if(a>=1e6)return s+'$'+(a/1e6).toFixed(1)+'M';if(a>=1e3)return s+'$'+(a/1e3).toFixed(0)+'K';return s+'$'+a.toFixed(0)}
  return(n>=0?'+':'')+n.toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:0,maximumFractionDigits:0});
}
function pct(n){return n==null?'—':(n>=0?'+':'')+n.toFixed(2)+'%'}
function date(s){if(!s)return'—';try{const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}catch(e){return s}}
function cp(n){return n>0?'c-win':n<0?'c-loss':'c-dim'}
function badgeClass(v){
  if(!v)return'b-neutral';
  const l=v.toLowerCase();
  if(l==='win')return'b-win';if(l==='loss')return'b-loss';
  if(l==='buy')return'b-buy';if(l==='short')return'b-short';if(l==='skip')return'b-skip';
  if(l==='high')return'b-high';if(l==='medium')return'b-medium';if(l==='low')return'b-low';
  return'b-neutral';
}

function consolidate(trades){
  const m=new Map();
  (trades||[]).forEach(t=>{
    const k=(t.ticker||'')+'|'+(t.exit_date||''),sh=t.shares||0;
    if(!m.has(k)){m.set(k,{...t,pnl:t.pnl||0,shares:sh,_fills:1,_ew:(t.entry_price||0)*sh,_xw:(t.exit_price||0)*sh,_sw:sh})}
    else{const g=m.get(k);g._fills++;g.pnl+=t.pnl||0;g.shares+=sh;g._ew+=(t.entry_price||0)*sh;g._xw+=(t.exit_price||0)*sh;g._sw+=sh}
  });
  return Array.from(m.values()).map(g=>{
    if(g._sw>0){g.entry_price=g._ew/g._sw;g.exit_price=g._xw/g._sw;g.pnl_pct=g.entry_price*g._sw>0?g.pnl/(g.entry_price*g._sw)*100:null}
    g.outcome=g.pnl>0.005?'WIN':g.pnl<-0.005?'LOSS':'BREAK_EVEN';
    return g;
  }).sort((a,b)=>(b.exit_date||'')>(a.exit_date||'')?1:-1);
}

// ── Parse markdown pipe table → HTML table with color-coded rows ────────────
function parseMarkdownTable(mdText){
  if(!mdText)return'';
  const lines=mdText.split('\n').map(l=>l.trim()).filter(l=>l.startsWith('|'));
  if(lines.length<2)return'';
  const isSep=l=>l.replace(/[\|\s\-:]/g,'').length===0;
  const splitCells=l=>l.split('|').slice(1,-1).map(c=>c.trim());
  const headers=splitCells(lines[0]);
  const dataLines=lines.filter((l,i)=>i>0&&!isSep(l));
  if(!headers.length||!dataLines.length)return'';

  const sigIdx=headers.findIndex(h=>/^signal$/i.test(h));
  const confIdx=headers.findIndex(h=>/^conf/i.test(h));
  const scoreIdxs=new Set(headers.map((h,i)=>/beat|guidance|setup|total|fund/i.test(h)?i:-1).filter(i=>i>=0));
  const olIdx=headers.findIndex(h=>/one.liner|one_liner/i.test(h));
  const numIdx=headers.findIndex(h=>/^#$/.test(h));

  let html='<div class="tw sc-table-wrap"><table class="dt"><thead><tr>';

  html+='</tr></thead><tbody>';

  dataLines.forEach(line=>{
    const cells=splitCells(line);
    const sig=sigIdx>=0?(cells[sigIdx]||'').trim():'';
    const rowCls=sig==='BUY'?'row-buy':sig==='SHORT'?'row-short':'';
    html+=`<tr class="${rowCls}">`;
    headers.forEach((_,i)=>{
      const cell=(cells[i]||'').trim();
      let content=esc(cell);
      if(i===sigIdx){
        const bc=sig==='BUY'?'b-buy':sig==='SHORT'?'b-short':'b-skip';
        content=`<span class="badge ${bc}">${esc(sig)}</span>`;
      } else if(i===confIdx&&cell){
        const bc=cell==='High'?'b-high':cell==='Medium'?'b-medium':'b-low';
        content=`<span class="badge ${bc}">${esc(cell)}</span>`;
      } else if(scoreIdxs.has(i)&&cell){
        const num=parseFloat(cell);
        if(!isNaN(num)){
          const col=num>0?'c-win':num<0?'c-loss':'c-dim';
          content=`<span class="tm ${col}" style="font-weight:700">${num>=0?'+':''}${num}</span>`;
        }
      } else if(i===olIdx){
        content=`<span class="one-liner-cell">${esc(cell)}</span>`;
      } else if(i===numIdx){
        content=`<span style="color:var(--muted);font-size:11px">${esc(cell)}</span>`;
      }
      html+=`<td>${content}</td>`;
    });
    html+='</tr>';
  });
  html+='</tbody></table></div>';
  return html;
}

let view='overview', tradeFilter={out:'all',dir:'all',q:''};
const VIEWS=['overview','screenings','analyses','watchlist','trades','reflections','performance','run'];
// Served by FastAPI (http/https) → use clean paths (/screenings). Opened as a
// local file:// → fall back to hash routing (#screenings), since paths can't work there.
const usePath=(location.protocol==='http:'||location.protocol==='https:');
// Current view from the URL — path first (when served), then hash. Defaults to overview.
function currentView(){
  if(usePath){
    const seg=location.pathname.replace(/^\/+|\/+$/g,'').split('/').pop();
    if(VIEWS.includes(seg))return seg;
  }
  const h=(location.hash||'').replace(/^#\/?/,'').split('?')[0].trim();
  return VIEWS.includes(h)?h:'overview';
}
// Switch the active view + render it. Does NOT touch the URL.
function applyView(v){
  if(!VIEWS.includes(v))v='overview';
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
  $('v-'+v).classList.add('active');$('ni-'+v).classList.add('active');
  view=v;render(v);window.scrollTo(0,0);
  document.title='TradingAgents — '+v.charAt(0).toUpperCase()+v.slice(1);
}
// Navigate to a view (nav click) — updates the URL so it's bookmarkable/reload-safe.
function go(v){
  if(!VIEWS.includes(v))v='overview';
  if(usePath){
    const url=(v==='overview'?'/':'/'+v);
    if(location.pathname!==url){try{history.pushState({v},'',url);}catch(e){}}
  } else if(('#'+v)!==location.hash){location.hash=v;}
  applyView(v);mobClose();
}
window.addEventListener('popstate',()=>applyView(currentView()));
window.addEventListener('hashchange',()=>{if(!usePath)applyView(currentView());});

// ── Calendar market-cap filter ────────────────────────────────────────────────
// Entries carry raw dollars (SPG = 72287464284). Inputs are friendlier: bare
// numbers mean millions, and a B/M/K/T suffix means what it says.
let _calCap={min:null,max:null,unknown:true};
let _calData={};                 // date -> day payload, kept for lazy body builds
let _calIdx={};                  // screening index, rebuilt with the calendar
const CAL_CAP_KEY='ta_cal_cap';
const CAL_PRESETS={
  all:   [null,null],
  micro: [null,300e6],
  small: [300e6,2e9],
  mid:   [2e9,10e9],
  large: [10e9,null],
};

try{const s=localStorage.getItem(CAL_CAP_KEY);if(s)_calCap={..._calCap,...JSON.parse(s)};}catch(e){}

function parseCap(v){
  const s=String(v??'').trim().toUpperCase().replace(/[$,\s]/g,'');
  if(!s)return null;
  const m=s.match(/^([0-9]*\.?[0-9]+)\s*([KMBT])?$/);
  if(!m)return null;
  const n=parseFloat(m[1]);
  if(!isFinite(n))return null;
  const mult={K:1e3,M:1e6,B:1e9,T:1e12}[m[2]||'M'];   // bare number = millions
  return n*mult;
}
function fmtCapShort(v){
  if(v==null)return'';
  if(v>=1e12)return (v/1e12).toFixed(v>=1e13?0:1)+'T';
  if(v>=1e9) return (v/1e9 ).toFixed(v>=1e10?0:1)+'B';
  if(v>=1e6) return (v/1e6 ).toFixed(v>=1e7 ?0:1)+'M';
  return String(Math.round(v));
}
function calCapActive(){return _calCap.min!=null||_calCap.max!=null;}
function calCapMatch(e){
  if(!calCapActive())return true;
  const v=e&&e.market_cap;
  if(v==null||!isFinite(v))return _calCap.unknown;   // no data: user's call
  if(_calCap.min!=null&&v<_calCap.min)return false;
  if(_calCap.max!=null&&v>_calCap.max)return false;
  return true;
}
function calCapSave(){try{localStorage.setItem(CAL_CAP_KEY,JSON.stringify(_calCap));}catch(e){}}

function calCapApply(){
  _calCap.min=parseCap(($('cal-cap-min')||{}).value);
  _calCap.max=parseCap(($('cal-cap-max')||{}).value);
  const u=$('cal-cap-unknown'); if(u)_calCap.unknown=u.checked;
  if(_calCap.min!=null&&_calCap.max!=null&&_calCap.min>_calCap.max){
    const t=_calCap.min;_calCap.min=_calCap.max;_calCap.max=t;   // be forgiving
  }
  calCapSave();
  calRepaint();
}
function calCapPreset(name){
  const [lo,hi]=CAL_PRESETS[name]||CAL_PRESETS.all;
  _calCap.min=lo;_calCap.max=hi;
  calCapSave();
  const mn=$('cal-cap-min'),mx=$('cal-cap-max');
  if(mn)mn.value=lo!=null?fmtCapShort(lo):'';
  if(mx)mx.value=hi!=null?fmtCapShort(hi):'';
  calRepaint();
}

function buildScreeningIndex() {

// Server-side index over every run, not just the loaded page. Reshaped into the
// {run, data} pairs the calendar renderer already expects.
async function calLoadScreeningIndex(){
  if(!usePath) return;
  const days=Object.keys(_calData||{}).sort();
  if(!days.length) return;
  const since=new Date(new Date(days[0]+'T00:00:00').getTime()-SCREENING_WINDOW_DAYS*86400000)
                 .toISOString().slice(0,10);
  try{
    const res=await fetch(`/api/screening-index?since=${since}`);
    if(!res.ok) return;                      // keep the loaded-runs index as-is
    const idx=await res.json();
    const out={};
    Object.entries(idx).forEach(([tk,rows])=>{
      out[tk]=rows.map(r=>({
        run:{id:r.run_id,date:r.date,earnings_date:r.earnings_date,depth:r.depth},
        data:r,
      }));
    });
    _calIdx=out;
  }catch(e){}
}

// How far back a screening still counts as "about" a given earnings date.
// Without this, a ticker that reports every quarter shows every screening ever
// run against it (AMKR/BRO/NUE span Apr→Jul) in each day's accordion, and the
// 25 runs that carry no earnings_date leak into every single day.
const SCREENING_WINDOW_DAYS = 30;

function daysBefore(runDate, earningsDate) {
  if(!runDate || !earningsDate) return null;
  const a = new Date(runDate+'T00:00:00'), b = new Date(earningsDate+'T00:00:00');
  if(isNaN(a) || isNaN(b)) return null;
  return (b - a) / 86400000;   // >0 = run happened before the print
}

// Screenings relevant to earnings date `d`: run within the trailing window
// (Aug 3 print → screenings done since Jul 3), regardless of which batch they
// came from. Recency is the rule, not the run's own earnings_date label: a
// batch is tagged with the date it targeted, but a ticker inside it can report
// a few days later (WHR sits in the Jul 27 batch yet prints Aug 3), and that
// screening is exactly the one worth seeing. Runs dated after the print are
// kept only when explicitly tagged for it, so a later cycle can't bleed back.
function screeningsForDay(allForTicker, d) {
  return (allForTicker||[]).filter(s => {
    const diff = daysBefore(s.run.date, d);
    if(diff === null) return true;
    if(diff < 0) return s.run.earnings_date === d;
    return diff <= SCREENING_WINDOW_DAYS;
  });
}

function nextWeekdayStr(base, offset) {
  let d = new Date(base+'T00:00:00');
  while(d.getDay()===0||d.getDay()===6) d.setDate(d.getDate()+1);
  for(let i=0;i<offset;i++){d.setDate(d.getDate()+1);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);}
  return d.toISOString().slice(0,10);
}

  }).join('');

  const tableHtml = entries.length
    ?`<div style="overflow-x:auto"><table class="dt"><thead><tr>

}

// Header only. Day bodies are built on expand (see toggleCalDay): rendering all
// of them eagerly cost ~683 KB of HTML and 546 checkboxes across five days,
// every one of them inside a collapsed container nobody was looking at.
function renderCalDayCard(d, day, scrIdx) {
  const all = day.entries || [];
  const entries = all.filter(calCapMatch);
  const fetchedAt = day.fetched_at?new Date(day.fetched_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
  const screenedCount = entries.filter(e=>(scrIdx[e.ticker]||[]).length>0).length;
  const dayRun = (DATA.screening_runs||[]).find(r=>r.earnings_date===d && r.allocation_md);
  const countTxt = calCapActive()
    ? `<span style="color:var(--accent)">${entries.length}</span> of ${all.length} companies`
    : `${all.length} companies`;

  return `<div class="cal-day">
    <div class="cal-day-hd" onclick="toggleCalDay('${d}')" style="cursor:pointer">
      <span class="chevron" id="cal-ch-${d}" style="color:var(--muted)">▶</span>
      <div style="flex:1">
        <div class="cal-day-title">${fmtCalDay(d)}</div>
        <div class="cal-day-sub">${countTxt} · ${screenedCount} screened · fetched ${fetchedAt}</div>
      </div>
      ${dayRun?`<button class="ab" style="margin-right:8px" onclick="event.stopPropagation();openDetail('Allocation — ${fmtCalDay(d)}',md(DATA.screening_runs.find(x=>x.id==='${dayRun.id}').allocation_md))">Allocation</button>`:''}
      <button class="cal-screen-btn" onclick="event.stopPropagation();calScreenDay('${d}')">Screen Selected ▶</button>
    </div>
    <div id="cal-bd-${d}" style="display:none" data-built="0"></div>
  </div>`;
}

async function calLoadForScreenings() {
  const el=$('cal-scr-days'); if(!el) return;
  _calIdx=buildScreeningIndex();          // whatever is loaded, as an instant first paint
  try {
    const res=await fetch('/api/calendar'); if(!res.ok) throw new Error(await res.text());
    _calData=await res.json();
    // The loaded page of runs is not the whole history — pull the calendar's own
    // index so a ticker's past screenings show whether or not its run is paged in.
    await calLoadScreeningIndex();
    const days=Object.keys(_calData).sort().reverse();
    el.innerHTML=days.length
      ?days.map(d=>renderCalDayCard(d,_calData[d],_calIdx)).join('')
      :'<div style="padding:18px 0;color:var(--muted);font-size:12px">No calendar data yet. Select a date range above and click "Fetch from NASDAQ".</div>';
    calRepaint();
  } catch(e) { if(el) el.innerHTML=`<div style="padding:12px;color:var(--muted)">Error: ${esc(e.message)}</div>`; }
}

async function calFetchRange() {
  const from=$('cal-from')?.value, to=$('cal-to')?.value;
  if(!from||!to){alert('Please select a date range.');return;}
  const btn=$('cal-range-btn'); if(btn){btn.disabled=true;btn.textContent='Fetching…';}
  try {
    const res=await fetch('/api/calendar/fetch-range',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({start:from,end:to})});
    if(!res.ok) throw new Error(await res.text());
    renderScreenings();
  } catch(e) {
    alert('Error: '+e.message);
    const b=$('cal-range-btn'); if(b){b.disabled=false;b.textContent='Fetch from NASDAQ';}
  }
}

function toggleCalDay(d){
  const body=document.getElementById('cal-bd-'+d), chev=document.getElementById('cal-ch-'+d);
  if(!body) return;
  const open=body.style.display!=='none';
  if(!open&&body.dataset.built!=='1'&&_calData[d]){
    body.innerHTML=calDayBodyHtml(d,_calData[d],_calIdx);   // build on first open
    body.dataset.built='1';
  }
  body.style.display=open?'none':'';
  if(chev){chev.style.transform=open?'':'rotate(90deg)';chev.style.color=open?'var(--muted)':'var(--accent)';}
}

function calScrSelectAll(date,checked){document.querySelectorAll(`input[data-calscr="${date}"]`).forEach(cb=>cb.checked=checked);}

// Tickers for a day: the user's checkbox selection when the day is open, else
// everything that passes the market-cap filter — "Screen Selected" has always
// worked on a collapsed card and must keep doing so now bodies are lazy.
function calDayTickers(date){
  const boxes=document.querySelectorAll(`input[data-calscr="${date}"]`);
  if(boxes.length)return Array.from(boxes).filter(cb=>cb.checked).map(cb=>cb.value);
  return ((_calData[date]||{}).entries||[]).filter(calCapMatch).map(e=>e.ticker);
}

function calScreenDay(date){
  const checked=calDayTickers(date);
  if(!checked.length){alert(calCapActive()?'No tickers match the market-cap filter for that day.':'No tickers selected.');return;}
  openScreenModal(checked,date);
}

async function csAddTickers(date,inputId){
  const inp=document.getElementById(inputId); if(!inp||!inp.value.trim()) return;
  const val=inp.value;
  try {
    const res=await fetch('/api/calendar/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date,tickers:val})});
    if(!res.ok) throw new Error(await res.text());
    renderScreenings();
  } catch(e){alert('Error: '+e.message);}
}

async function csRemoveTicker(date,ticker){
  try {
    const res=await fetch(`/api/calendar/${date}/${encodeURIComponent(ticker)}`,{method:'DELETE'});
    if(!res.ok) throw new Error(await res.text());
    renderScreenings();
  } catch(e){alert('Error: '+e.message);}
}

function openTickerHistory(ticker,ev,day,showAll){
  if(ev) ev.stopPropagation();
  const all=buildScreeningIndex()[ticker]||[];
  const scrs=(day&&!showAll)?screeningsForDay(all,day):all;
  if(!scrs.length) return;
  const hidden=all.length-scrs.length;
  let body='<div style="padding:0 22px">';
  if(day&&!showAll&&hidden>0){
    body+=`<div style="display:flex;align-items:center;gap:10px;padding:10px 0 12px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--border)">
      <span style="flex:1">Showing screenings from the ${SCREENING_WINDOW_DAYS} days before this print · ${hidden} older hidden</span>
      <button class="ab" onclick="closeDetail();openTickerHistory('${esc(ticker)}',null,'${esc(day)}',true)">Show all ${all.length} →</button>
    </div>`;
  }
  scrs.forEach(({run,data})=>{
    const sig=data.signal||'—', bc=sig==='BUY'?'b-buy':sig==='SHORT'?'b-short':'b-skip';
    const tot=data.total_score||0;
    body+=`<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)">
      <div style="flex:1">
        <div style="font-size:12.5px;font-weight:600">${esc(run.date)}</div>
        <div style="font-size:11px;color:var(--dim)">Run: ${esc(run.id)} · Total: <span class="${tot>=0?'c-win':'c-loss'}" style="font-weight:700">${tot>=0?'+':''}${tot}</span></div>
      </div>
      <span class="badge ${bc}">${esc(sig)}</span>
      <button class="ab" onclick="closeDetail();openTickerDetail('${run.id}','${esc(ticker)}')">View →</button>
    </div>`;
  });
  body+='</div>';
  openDetail(`${esc(ticker)} — Screening History (${scrs.length})`,body);
}

async function runScreenModal(){
  const g=id=>document.getElementById(id)?.value||'';

  const date=g('sm-date');

    <div id="sm-done-row" style="display:none;margin-top:14px;gap:10px;align-items:center"></div>`;

    const res=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'screen',params})});

  } catch(e){
    const l=$('sm-log');if(l)l.textContent='Error: '+e.message;
    const st=$('sm-status');if(st){st.className='job-status error';st.textContent='✕ error';}
    return;
  }
  _bnrShow('screen',jobId);
  const proto=location.protocol==='https:'?'wss:':'ws:';
  const ws=new WebSocket(`${proto}//${location.host}/ws/${jobId}`);
  _smWs=ws;
  ws.onmessage=e=>{
    if(e.data==='__DONE__'){
      _bnrHide('screen');
      const st=$('sm-status');if(st){st.className='job-status done';st.textContent='✓ done';}
      // Pre-fetch fresh runs so the Screenings view is ready immediately
      _screeningsRefreshing=false;_scrPullRuns();
      const dr=$('sm-done-row');if(dr){dr.style.display='flex';dr.innerHTML=`<button class="btn-run" onclick="closeScreenModal();go('screenings')">View in Screenings</button><button class="dp-btn" onclick="closeScreenModal()" style="margin-left:6px">Close</button>`;}

    if(e.data==='__ERROR__'){_bnrHide('screen');const st=$('sm-status');if(st){st.className='job-status error';st.textContent='✕ error';}return;}
    const l=$('sm-log');if(l){l.textContent+=e.data+'\n';l.scrollTop=l.scrollHeight;}
  };
  ws.onerror=()=>{_bnrHide('screen');const st=$('sm-status');if(st){st.className='job-status error';st.textContent='✕ ws error';}};
}

let _screeningsRefreshing=false,_scrSig=null;

// Cheap "did anything finish?" probe: names + ticker counts + allocation flags
// for every run, ~11 KB. This used to re-download the entire 3.2 MB /api/data
// on every visit to Screenings — a second of network and a main-thread
// JSON.parse for a payload that is almost always identical to the one the page
// was served with. Now the heavy fetch happens only when the probe changes.
function _scrCheck(){
  if(_screeningsRefreshing)return;
  _screeningsRefreshing=true;
  fetch('/api/screening-runs').then(r=>r.ok?r.json():null).then(list=>{
    _screeningsRefreshing=false;
    if(!Array.isArray(list))return;
    const sig=list.map(r=>`${r.name}:${r.tickers}:${r.has_allocation?1:0}`).join('|');
    if(_scrSig===null){_scrSig=sig;return;}   // first look: the embed IS this state
    if(sig===_scrSig)return;
    _scrSig=sig;
    _scrPullRuns();
  }).catch(()=>{_screeningsRefreshing=false;});
}

// Pull the first page of runs and merge, keeping any extra pages the user
// loaded — otherwise a refresh silently throws their "Load more" away.
function _scrPullRuns(){
  fetch('/api/runs?offset=0&limit=12').then(r=>r.ok?r.json():null).then(j=>{
    if(!j||!Array.isArray(j.runs))return;
    const old=DATA.screening_runs||[];
    const seen=new Set(j.runs.map(r=>r.id));
    DATA.screening_runs=j.runs.concat(old.filter(r=>!seen.has(r.id)));
    if(j.total_runs!=null)DATA.total_runs=j.total_runs;
    if(currentView()==='screenings')renderScreenings();
  }).catch(()=>{});
}

function renderScreenings(){
  const today=new Date().toISOString().slice(0,10);
  const calFrom=nextWeekdayStr(today,0), calTo=nextWeekdayStr(calFrom,4);
  const runs=DATA.screening_runs||[];
  const sa=DATA.standalone_analyses||[];
  _scrCheck();

  const totalRuns=DATA.total_runs!=null?DATA.total_runs:runs.length;
  let h=`<div class="ds-warn-slot">${dsWarnHtml()}</div><div class="ph"><h2>Screenings</h2><p>${runs.length}${totalRuns>runs.length?` of ${totalRuns}`:''} run${totalRuns!==1?'s':''} · fetch the earnings calendar below, select tickers to screen, or expand past runs to review results</p></div>

<div class="section">
  <div class="sec-hd" style="margin-bottom:10px"><div class="sec-title">NASDAQ Earnings Calendar</div></div>
  <div class="cal-fetch-bar" style="margin-bottom:14px">
    <div class="dp-fg"><label>From</label><input type="date" id="cal-from" value="${calFrom}" style="width:138px;color-scheme:dark"></div>
    <div class="dp-fg"><label>To</label><input type="date" id="cal-to" value="${calTo}" style="width:138px;color-scheme:dark"></div>
    <button class="btn-run" id="cal-range-btn" onclick="calFetchRange()">Fetch from NASDAQ</button>
    <span style="font-size:11.5px;color:var(--dim);align-self:center">AH of each day + PM of next trading day</span>
  </div>
  ${calCapBarHtml()}
  <div id="cal-scr-days"><div style="color:var(--muted);font-size:12px">Loading calendar…</div></div>
</div>

<hr class="divider">
`;

  if(!runs.length){h+=`<div class="empty"><span class="ei">⊞</span>No screening runs yet. Pick tickers from the calendar above and click "Screen Selected ▶".</div>`;}
  else runs.forEach(r=>{
    const buys=(r.tickers||[]).filter(t=>t.signal==='BUY');
    const shorts=(r.tickers||[]).filter(t=>t.signal==='SHORT');
    const skips=(r.tickers||[]).filter(t=>t.signal==='SKIP');
    const calBadge=r.calibration&&r.calibration.signal_accuracy_pct!=null
      ?`<span class="badge b-medium" style="margin-left:6px">cal ${Math.round(r.calibration.signal_accuracy_pct)}%</span>`:'';
    const tableHtml=parseMarkdownTable(r.screening_table_md||'');
    const chipsHtml=(r.tickers||[]).map(t=>`<span class="chip ${(t.signal||'skip').toLowerCase()}" onclick="openTickerDetail('${r.id}','${t.ticker}')" title="${esc(t.signal)} · ${esc(t.confidence)}">${esc(t.ticker)}</span>`).join('');
    h+=`<div class="sc" id="sc-${r.id}">
      <div class="sc-hd" onclick="toggleSc('${r.id}')">
        <div class="sc-date">${r.date}</div>
        <div class="sc-meta">
          <div style="font-size:13px;font-weight:600">${r.n_tickers||0} tickers${calBadge}</div>
          <div style="font-size:11px;color:var(--dim);margin-top:2px">${buys.length} BUY · ${shorts.length} SHORT · ${skips.length} SKIP</div>
        </div>
        <div class="sc-actions">
          ${r.allocation_md?`<button class="ab" onclick="event.stopPropagation();openDetail('Allocation — ${r.date}',md(DATA.screening_runs.find(x=>x.id==='${r.id}').allocation_md))">Allocation</button>`:''}
          ${usePath?`<button class="ab" title="Screen any missing tickers, rebuild the table and re-run allocation" onclick="event.stopPropagation();runResume('${r.id}',this)">⟳ Resume</button>`:''}
          <span class="chevron" id="ch-${r.id}">▶</span>
        </div>
      </div>
      <div class="sc-body" id="sb-${r.id}">
        ${tableHtml||`<div style="padding:14px 20px;color:var(--muted);font-size:12px">No screening table available.</div>`}
        <div class="sc-briefs-section">
          <div class="sc-section-label">Earnings Briefs + PM Decision — click a ticker to read</div>
          ${chipsHtml||'<span style="color:var(--muted);font-size:12px">No ticker data.</span>'}
        </div>
      </div>
    </div>`;
  });

  if(totalRuns>runs.length){
    h+=`<div style="text-align:center;padding:16px 0">
      <button class="btn-run" id="scr-more" onclick="loadMoreRuns(this)">Load ${Math.min(12,totalRuns-runs.length)} older run${totalRuns-runs.length!==1?'s':''} <span style="opacity:.6;font-weight:400">(${runs.length} of ${totalRuns} loaded)</span></button>
    </div>`;
  }

  // Single-ticker analyses used to be dumped at the bottom of this page, where
  // they got lost. They now live on the Analyses view alongside every screened
  // ticker; this just points there.
  if(sa.length){
    h+=`<hr class="divider">
      <div class="lc" onclick="go('analyses')">
        <div class="lc-icon">☰</div>
        <div class="lc-body">
          <div class="lc-title">${sa.length} single-ticker analysis run${sa.length!==1?'s':''}</div>
          <div class="lc-sub">Browse these and every screened ticker on the Analyses page</div>
        </div>
        <div class="lc-meta"><span style="font-size:11px;color:var(--accent)">Open →</span></div>
      </div>`;
  }
  $('v-screenings').innerHTML=h;
  calLoadForScreenings();
}

// Older runs are fetched a page at a time — the full set is ~27 MB of report
// bodies, which is why the first payload carries neither all runs nor any body.
async function loadMoreRuns(btn){
  if(btn){btn.disabled=true;btn.textContent='Loading…';}
  try{
    const have=(DATA.screening_runs||[]).length;
    const res=await fetch(`/api/runs?offset=${have}&limit=12`);
    if(!res.ok)throw new Error('server error '+res.status);
    const {runs,total_runs}=await res.json();
    const seen=new Set((DATA.screening_runs||[]).map(r=>r.id));
    DATA.screening_runs=(DATA.screening_runs||[]).concat((runs||[]).filter(r=>!seen.has(r.id)));
    DATA.total_runs=total_runs;
    _anLimit=AN_PAGE;                       // Analyses derives from these runs
    renderScreenings();
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='Load more — '+e.message;}
  }
}

// ── Analyses ────────────────────────────────────────────────────────────────
// Every ticker-level analysis in one browsable place: the per-ticker work from
// each screening run plus standalone `analyze` runs, which are otherwise only
// reachable by expanding the run that produced them.
let _anQuery='',_anSource='all',_anSignal='all',_anLimit=150;
const AN_PAGE=150;

function buildAllAnalyses(){
  const out=[];
  (DATA.screening_runs||[]).forEach(run=>{
    (run.tickers||[]).forEach(t=>{
      out.push({
        ticker:t.ticker||'', date:run.date||'', source:'screening',
        runId:run.id, runType:run.run_type, earningsDate:run.earnings_date,
        signal:t.signal, confidence:t.confidence, total:t.total_score,
        oneLiner:t.one_liner, alloc:t.allocation_amount,
      });
    });
  });
  (DATA.standalone_analyses||[]).forEach(a=>{
    out.push({
      ticker:a.ticker||'', date:a.date||'', source:'standalone',
      id:a.id, reportType:a.report_type,
      signal:a.signal, confidence:a.confidence, total:a.total_score,
      oneLiner:a.one_liner, alloc:null,
    });
  });
  out.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||a.ticker.localeCompare(b.ticker));
  return out;
}

function anSetQuery(v){_anQuery=(v||'').trim().toUpperCase();_anLimit=AN_PAGE;anRenderList();}
function anSetSource(v){_anSource=v;_anLimit=AN_PAGE;anRenderList();}
function anSetSignal(v){_anSignal=v;_anLimit=AN_PAGE;anRenderList();}
function anMore(){_anLimit+=AN_PAGE;anRenderList();}

function anFiltered(){
  return buildAllAnalyses().filter(a=>{
    if(_anSource!=='all'&&a.source!==_anSource) return false;
    if(_anSignal!=='all'&&(a.signal||'')!==_anSignal) return false;
    if(_anQuery&&!a.ticker.toUpperCase().includes(_anQuery)) return false;
    return true;
  });
}

function anOpen(idx){
  const a=anFiltered()[idx];
  if(!a) return;
  if(a.source==='screening'){ openTickerDetail(a.runId,a.ticker); return; }
  const rec=(DATA.standalone_analyses||[]).find(x=>x.id===a.id);
  if(!rec) return;
  let body='';
  if(rec.portfolio_decision_md){
    body+=`<div class="pm-header">Portfolio Manager Decision</div><div class="pm-body">${md(rec.portfolio_decision_md)}</div>`;
  }
  body+=`<div class="brief-header">${rec.report_type==='analysis'?'Analysis Report':'Pre-Earnings Brief &amp; Scores'}</div>`;
  body+=rec.earnings_brief_md?md(rec.earnings_brief_md):'<p style="padding:20px 24px;color:var(--dim)">No report body available.</p>';
  openDetail(`${a.ticker} — ${a.date}`,body);
}

function anRenderList(){
  const el=$('an-list'); if(!el) return;
  const rows=anFiltered();
  const shown=rows.slice(0,_anLimit);
  const sc=n=>n!=null?`<span class="${n>0?'c-win':n<0?'c-loss':'c-dim'}" style="font-weight:700;font-family:var(--mono)">${n>=0?'+':''}${n}</span>`:'<span style="color:var(--muted)">—</span>';
  if(!rows.length){
    el.innerHTML=`<div class="empty"><span class="ei">☰</span>No analyses match those filters.</div>`;
    return;
  }
  const body=shown.map((a,i)=>{
    const sig=a.signal||'—';
    const sbc=sig==='BUY'?'b-buy':sig==='SHORT'?'b-short':'b-skip';
    const conf=a.confidence||'—';
    const cbc=conf==='High'?'b-high':conf==='Medium'?'b-medium':'b-low';
    const srcLabel=a.source==='standalone'
      ?`<span class="badge b-medium" title="Standalone analyze run">single</span>`
      :`<span style="font-size:10.5px;color:var(--dim)" title="${esc(a.runId||'')}">${esc(a.runType||'screening')}</span>`;
    return `<tr style="cursor:pointer" onclick="anOpen(${i})">
      <td><strong class="tm" style="color:var(--accent)">${esc(a.ticker)}</strong></td>
      <td style="color:var(--dim);font-family:var(--mono);font-size:11.5px">${esc(a.date||'—')}</td>
      <td>${srcLabel}</td>
      <td style="text-align:center">${a.signal?`<span class="badge ${sbc}">${esc(sig)}</span>`:'<span style="color:var(--muted)">—</span>'}</td>
      <td>${a.confidence?`<span class="badge ${cbc}">${esc(conf)}</span>`:'<span style="color:var(--muted)">—</span>'}</td>
      <td class="num">${sc(a.total)}</td>
      <td class="num">${a.alloc?`<span style="color:var(--win)">$${Math.round(a.alloc/1000)}k</span>`:''}</td>
      <td style="color:var(--dim);font-size:11px;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(a.oneLiner||'')}">${esc(a.oneLiner||'')}</td>
      <td style="text-align:right"><span style="font-size:11px;color:var(--accent)">Read →</span></td>
    </tr>`;
  }).join('');
  el.innerHTML=`<div style="font-size:11.5px;color:var(--muted);margin-bottom:8px">Showing ${shown.length} of ${rows.length}</div>
    <div style="overflow-x:auto"><table class="dt"><thead><tr>
      <th>Ticker</th><th>Date</th><th>Source</th><th style="text-align:center">Signal</th><th>Conf</th>
      <th class="tr">Total</th><th class="tr">Alloc</th><th>One-liner</th><th></th>
    </tr></thead><tbody>${body}</tbody></table></div>
    ${shown.length<rows.length?`<div style="text-align:center;margin-top:14px"><button class="ab" onclick="anMore()">Show ${Math.min(AN_PAGE,rows.length-shown.length)} more</button></div>`:''}
    ${anCanLoadRuns()?`<div style="text-align:center;margin-top:10px;font-size:11.5px;color:var(--muted)">
      Showing analyses from the ${(DATA.screening_runs||[]).length} most recent runs of ${DATA.total_runs}.
      <button class="ab" style="margin-left:8px" onclick="loadMoreRuns(this).then(()=>{go('analyses')})">Load older runs</button>
    </div>`:''}`;
}

// Analyses are derived from the loaded screening runs, so "everything" here means
// "everything loaded" — say so, and offer the same paging the Screenings view has.
function anCanLoadRuns(){
  return usePath&&DATA.total_runs!=null&&DATA.total_runs>(DATA.screening_runs||[]).length;
}

  $('v-analyses').innerHTML=`<div class="ph"><h2>Analyses</h2>
      <p>${all.length} ticker-level analyses · ${nTickers} unique tickers · ${nRuns} screening runs + ${nStandalone} standalone run${nStandalone!==1?'s':''}</p></div>
    <div class="section">
      <div class="cal-fetch-bar" style="margin-bottom:14px">
        <div class="dp-fg"><label>Ticker</label>
          <input type="text" id="an-q" placeholder="Search…" value="${esc(_anQuery)}" oninput="anSetQuery(this.value)" style="width:150px"></div>
        <div class="dp-fg"><label>Source</label>
          <select id="an-src" onchange="anSetSource(this.value)" style="width:150px">
            ${opt('all','All sources',_anSource)}${opt('screening','From screenings',_anSource)}${opt('standalone','Standalone only',_anSource)}
          </select></div>
        <div class="dp-fg"><label>Signal</label>
          <select id="an-sig" onchange="anSetSignal(this.value)" style="width:120px">

function toggleSc(id){
  const b=$('sb-'+id),c=$('ch-'+id),open=b.style.display==='block';
  b.style.display=open?'none':'block';
  c.style.transform=open?'':'rotate(90deg)';
